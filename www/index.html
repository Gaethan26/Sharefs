<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sharefs</title>
<meta name="theme-color" content="#E9ECF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF2;--surface:#FFFFFF;--surface2:#DDE2EB;--ink:#18213A;--muted:#596482;--line:#C9D0DD;
  --act:#18213A;--act-ink:#FFFFFF;
  --film:#E3A900;--serie:#2F6FDB;--livre:#1C9662;--jeu:#D43F7D;
  --film-ink:#18213A;--hl:#FFE38A;
  --r-lg:22px;--r-md:14px;--r-sm:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11162A;--surface:#1A2138;--surface2:#242C47;--ink:#E8EBF4;--muted:#9AA3BF;--line:#323B5A;
    --act:#E8EBF4;--act-ink:#11162A;--film:#F2BC1B;--serie:#4C86EE;--livre:#2DB079;--jeu:#E65792;--hl:#6B5600;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11162A;--surface:#1A2138;--surface2:#242C47;--ink:#E8EBF4;--muted:#9AA3BF;--line:#323B5A;
  --act:#E8EBF4;--act-ink:#11162A;--film:#F2BC1B;--serie:#4C86EE;--livre:#2DB079;--jeu:#E65792;--hl:#6B5600;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--serie);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variation-settings:"wdth" 80;line-height:1}
.brand span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:var(--jeu);box-shadow:13px 0 0 var(--film),26px 0 0 var(--serie),39px 0 0 var(--livre);vertical-align:6px}
.iconbtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800;font-variation-settings:"wdth" 85;margin:10px 0 6px}
h2{font-size:21px;letter-spacing:-.02em;margin:28px 0 10px;font-weight:750}
.sub{color:var(--muted);margin:0 0 18px}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
.banner{background:var(--surface2);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--muted);margin:8px 0 14px}
/* type marks */
.tm{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.t-f{background:var(--film)}.t-s{background:var(--serie)}.t-l{background:var(--livre)}.t-j{background:var(--jeu)}
/* feed */
.ev{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.ev .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.ev .who b{color:var(--ink);font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.ev .work{display:flex;gap:14px;align-items:stretch;margin-top:12px;border:0;background:none;padding:0;text-align:left;width:100%}
.cover{width:54px;min-height:78px;border-radius:6px 3px 3px 6px;flex:none;position:relative;display:flex;align-items:flex-end;padding:6px;color:#fff;font-weight:800;font-size:11px;line-height:1.05;overflow:hidden}
.cover.t-f{color:var(--film-ink)}
.cover::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.18)}
.ev .ti{font-size:19px;font-weight:750;line-height:1.15;letter-spacing:-.01em}
.meta{font-size:14px;color:var(--muted)}
.note{margin:12px 0 0;font-size:16px;padding-left:12px;border-left:3px solid var(--line)}
.ev .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:650;font-size:15px;background:var(--surface2)}
.btn.pri{background:var(--act);color:var(--act-ink)}
.btn.on{background:var(--livre);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.empty{text-align:center;padding:36px 20px;background:var(--surface);border-radius:var(--r-lg);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.empty .btn{margin-top:14px}
/* search */
.sbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--bg);padding-bottom:10px}
.field{position:relative}
.field input{width:100%;height:64px;border:2px solid var(--ink);background:var(--surface);border-radius:var(--r-lg);padding:0 52px 0 52px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.field input::placeholder{color:var(--muted);font-weight:500}
.field input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--serie) 35%,transparent)}
.field .lens{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none}
.field .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:none}
.field.has .clear{display:grid;place-items:center}
.ac{position:absolute;left:0;right:0;top:70px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(10,15,35,.35);max-height:min(60vh,460px);overflow:auto;display:none;padding:6px 0}
.ac.open{display:block}
.ac .grp{font-size:13px;color:var(--muted);padding:10px 16px 4px;font-weight:600}
.ac .opt{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.ac .opt[aria-selected="true"]{background:var(--surface2)}
.ac .opt .ot{font-weight:650}
.ac .opt .om{font-size:13px;color:var(--muted)}
.ac .opt .chev{margin-left:auto;font-size:13px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.chip.ftr{margin-left:auto}
.chip .cnt{background:var(--jeu);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:6px 16px 16px;margin-top:10px;display:none}
.panel.open{display:block}
.panel h3{font-size:15px;margin:14px 0 8px;font-weight:700}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.wrap .chip{font-size:14px;padding:5px 12px}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selrow label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:0;background:var(--surface2);border-radius:999px;padding:4px 10px 4px 12px;font-size:14px}
.pill::after{content:"×";margin-left:6px;color:var(--muted)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:14px;color:var(--muted)}
.res{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.res li+li{border-top:1px solid var(--line)}
.res button{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;align-items:center}
.res .cover{width:38px;min-height:54px;font-size:0}
.res .ti{font-weight:700;font-size:17px;line-height:1.2}
.badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:650;border-radius:999px;padding:1px 8px;background:var(--surface2)}
.bdg.done{background:var(--livre);color:#fff}
.bdg.rec{background:var(--jeu);color:#fff}
/* collection */
.who-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.who-row::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:10px 10px 8px}
.stat b{font-size:26px;font-weight:800;line-height:1;display:block;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.level{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s}
.shelf-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.shelf{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0;row-gap:0;background:linear-gradient(var(--surface),var(--surface));border-radius:var(--r-lg);padding:18px 14px 0}
.plank{display:flex;align-items:flex-end;gap:3px;width:100%;flex-wrap:wrap;border-bottom:10px solid var(--surface2);padding-bottom:0;margin-bottom:16px;min-height:130px}
.spine{border:0;width:30px;border-radius:3px 3px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;text-align:left;line-height:30px}
.spine.t-f{color:var(--film-ink)}
.spine.new{animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:rotate(180deg) translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.spine.new{animation:none}.bar i{transition:none}}
.slot{width:30px;height:70px;border:1.5px dashed var(--line);border-radius:3px}
.sets{display:grid;gap:10px}
.set{background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.set>button{border:0;background:none;padding:0;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.set .sn{font-weight:700;font-size:17px}
.set .sc{color:var(--muted);font-size:14px;white-space:nowrap}
.set.full .sn::after{content:" ✓";color:var(--livre)}
.set ul{list-style:none;padding:0;margin:10px 0 0;display:none}
.set.open ul{display:block}
.set li button{border:0;background:none;padding:6px 0;display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:15px}
.set li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.set li .ck.y{background:var(--livre);border-color:var(--livre)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;gap:16px}
.sh-top .cover{width:84px;min-height:122px;font-size:13px}
.sh-top h3{font-size:25px;line-height:1.08;margin:2px 0 6px;letter-spacing:-.02em;font-weight:800}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:16px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.sh-acts{display:flex;gap:8px;flex-wrap:wrap}
.sh-acts .btn{flex:1 1 auto;padding:12px 16px}
textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:10px 12px;font-size:16px;min-height:84px;resize:vertical;margin:12px 0 8px}
.social{margin-top:18px;font-size:15px}
.social .line{display:flex;align-items:center;gap:8px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--act);color:var(--act-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px))}
.gate.open{display:block}
.gate .in{max-width:420px;margin:0 auto}
.gate .brand{font-size:44px;margin-bottom:26px}
.gate h1{font-size:30px}
.gate input{width:100%;height:56px;border:2px solid var(--ink);background:var(--surface);border-radius:var(--r-md);padding:0 16px;font-size:19px;margin:6px 0 12px}
.gate .btn{width:100%;padding:14px;font-size:17px;margin-top:4px}
.gate .err{color:var(--jeu);font-weight:600;min-height:1.4em;margin:6px 0}
.gate .or{text-align:center;color:var(--muted);margin:20px 0 10px}
.account{background:var(--surface);border-radius:var(--r-lg);padding:6px 16px 16px;margin-top:10px}
.account .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.account .code{font-size:22px;font-weight:800;letter-spacing:.08em}
.account .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn.danger{background:none;color:var(--jeu)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" aria-label="Sharefs">Sharefs<span aria-hidden="true"></span></div>
    <button class="iconbtn" id="goSearch" aria-label="Rechercher une œuvre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>
  <div id="banner"></div>

  <section class="view on" id="v-feed" aria-labelledby="h-feed">
    <h1 id="h-feed">Tu verras…</h1>
    <p class="sub">Les films, séries, livres et jeux que tes amis te conseillent.</p>
    <div id="feed"></div>
  </section>

  <section class="view" id="v-search" aria-labelledby="h-search">
    <h1 id="h-search" class="sr">Recherche</h1>
    <div class="sbox">
      <div class="field" id="field">
        <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Titre, auteur, studio, genre…" role="combobox" aria-expanded="false" aria-controls="ac" aria-autocomplete="list" aria-label="Rechercher une œuvre">
        <button class="clear" id="clear" aria-label="Effacer la recherche"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="ac" id="ac" role="listbox" aria-label="Suggestions"></div>
      </div>
      <div class="row" id="typeChips"></div>
    </div>
    <div class="panel" id="panel">
      <h3>Genres</h3><div class="wrap" id="fGenres"></div>
      <h3>Période</h3><div class="wrap" id="fDecades"></div>
      <h3>Durée</h3><div class="wrap" id="fDur"></div>
      <h3>Mon statut</h3><div class="wrap" id="fStatus"></div>
      <h3>Plus</h3>
      <div class="selrow">
        <label>Pays<select id="fCountry"></select></label>
        <label>Créateur<select id="fCreator"></select></label>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:16px">
        <button class="btn" id="reset">Tout effacer</button>
        <button class="btn pri" id="closePanel">Voir les résultats</button>
      </div>
    </div>
    <div class="pills" id="pills"></div>
    <div class="rhead"><span id="count"></span>
      <label class="sr" for="sort">Trier</label>
      <select id="sort">
        <option value="rel">Pertinence</option>
        <option value="friends">Populaire chez mes amis</option>
        <option value="new">Plus récent</option>
        <option value="old">Plus ancien</option>
        <option value="az">Titre A–Z</option>
        <option value="short">Plus court</option>
      </select>
    </div>
    <ul class="res" id="results"></ul>
  </section>

  <section class="view" id="v-coll" aria-labelledby="h-coll">
    <h1 id="h-coll">Collection</h1>
    <div class="who-row" id="whoRow"></div>
    <div class="stats" id="stats"></div>
    <div class="level" id="level"></div>
    <h2>L’étagère</h2>
    <div id="shelf"></div>
    <h2>Séries à compléter</h2>
    <div class="sets" id="sets"></div>
    <div id="account"></div>
  </section>
</div>

<nav class="tabs" aria-label="Navigation principale"><div class="in">
  <button data-tab="feed" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Fil</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Recherche</button>
  <button data-tab="coll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5.5l3.6-1 3.4 14.5-3.6 1z"/></svg>Collection</button>
</div></nav>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle"><div class="in" id="gateIn"></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ---------- Catalogue ---------- */
const RAW=`f|Inception|2010|Christopher Nolan|SF,Thriller|148|US
f|Interstellar|2014|Christopher Nolan|SF,Drame|169|US
f|The Dark Knight|2008|Christopher Nolan|Action,Thriller|152|US
f|Oppenheimer|2023|Christopher Nolan|Drame,Historique|180|US
f|Memento|2000|Christopher Nolan|Thriller,Mystère|113|US
f|Parasite|2019|Bong Joon-ho|Thriller,Drame|132|KR
f|Memories of Murder|2003|Bong Joon-ho|Policier,Thriller|131|KR
f|Old Boy|2003|Park Chan-wook|Thriller|120|KR
f|Le Voyage de Chihiro|2001|Hayao Miyazaki|Animation,Fantastique|125|JP
f|Princesse Mononoké|1997|Hayao Miyazaki|Animation,Fantastique|134|JP

  w.id=t+'-'+norm(ti).replace(/ /g,'-');w._t=norm(ti);w._c=norm(c);w._all=norm([ti,c,g.replace(/,/g,' '),COUNTRY[p]||'',y,T[t].n].join(' '));
  const b=T[t].b;w.len=d<=b[0]?'court':d<=b[1]?'moyen':'long';return w});
const BY=Object.fromEntries(W.map(w=>[w.id,w]));
const GENRES=[...new Set(W.flatMap(w=>w.g))].sort((a,b)=>a.localeCompare(b,'fr'));

].map(s=>({...s,ids:W.filter(s.f).map(w=>w.id)}));

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let saving=false,dirty=false,myName='',myCircles=[];
async function save(){
  if(!uid)return;dirty=true;if(saving)return;saving=true;
  while(dirty){dirty=false;
    const {error}=await sb.from('sharefs_profiles').update({data:JSON.parse(JSON.stringify(mine)),updated_at:new Date().toISOString()}).eq('id',uid);

const cover=(w,cls='')=>`<span class="cover t-${w.t} ${cls}" aria-hidden="true">${esc(w.ti.length>22?w.ti.slice(0,20)+'…':w.ti)}</span>`;
const metaLine=w=>`${T[w.t].n}, ${w.y}, ${esc(w.c)}`;
function isDone(id,who=uid){const m=who===uid?mine:members[who];return !!(m&&m.done&&m.done[id])}
function isWant(id){return !!mine.want[id]}
function recommenders(id){return Object.keys(members).filter(k=>k!==uid&&(members[k].shares||[]).some(s=>s.w===id))}
function finishers(id){return Object.keys(members).filter(k=>k!==uid&&members[k].done&&members[k].done[id])}
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'à l’instant';if(s<3600)return`il y a ${Math.floor(s/60)} min`;if(s<86400)return`il y a ${Math.floor(s/3600)} h`;const d=Math.floor(s/86400);return d<30?`il y a ${d} j`:new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}

/* ---------- Recherche ---------- */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;let p=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function score(w,q){
  if(!q)return 1;const t=w._t;
  if(t===q)return 100;if(t.startsWith(q))return 85;if((' '+t).includes(' '+q))return 70;if(t.includes(q))return 55;
  if(w._c.startsWith(q)||(' '+w._c).includes(' '+q))return 45;
  if(w._all.includes(q))return 32;
  const toks=q.split(' ').filter(Boolean),words=w._all.split(' ');
  if(toks.every(k=>w._all.includes(k)))return 26;
  if(toks.every(k=>k.length<4?w._all.includes(k):words.some(x=>lev(k,x.slice(0,k.length))<=1||lev(k,x)<=1)))return 12;
  return 0;
}
function hl(text,q){
  if(!q)return esc(text);
  const flat=[...text].map(c=>{const n=c.normalize('NFD')[0].toLowerCase();return /[a-z0-9]/.test(n)?n:' '}).join('');
  const i=flat.indexOf(q);if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
function passFilters(w){
  if(F.types.size&&!F.types.has(w.t))return false;
  if(F.genres.size&&!w.g.some(g=>F.genres.has(g)))return false;
  if(F.decades.size&&!F.decades.has(dec(w.y)))return false;
  if(F.dur.size&&!F.dur.has(w.len))return false;
  if(F.country&&w.p!==F.country)return false;
  if(F.creator&&w.c!==F.creator)return false;
  if(F.status==='todo'&&isDone(w.id))return false;
  if(F.status==='done'&&!isDone(w.id))return false;
  if(F.status==='want'&&!isWant(w.id))return false;
  if(F.status==='rec'&&!recommenders(w.id).length)return false;
  return true;
}
const dec=y=>y<1960?'Avant 1960':Math.floor(y/10)*10+'s';
function popularity(id){return recommenders(id).length*2+finishers(id).length}
function search(){
  const q=norm($('#q').value);
  let r=W.map(w=>({w,s:score(w,q)})).filter(x=>x.s>0&&passFilters(x.w));
  const S=F.sort;
  r.sort((a,b)=>S==='new'?b.w.y-a.w.y:S==='old'?a.w.y-b.w.y:S==='az'?a.w.ti.localeCompare(b.w.ti,'fr'):S==='short'?rel(a.w)-rel(b.w):S==='friends'?popularity(b.w.id)-popularity(a.w.id)||b.s-a.s:b.s-a.s||popularity(b.w.id)-popularity(a.w.id)||b.w.y-a.w.y);
  return {r,q};
}
const rel=w=>w.d/T[w.t].b[1];
function renderResults(){
  const {r,q}=search();
  $('#count').textContent=r.length?`${r.length} œuvre${r.length>1?'s':''}`:'';
  const ul=$('#results');
  if(!r.length){ul.innerHTML=`<li><div class="empty"><b>Aucune œuvre ne correspond.</b>Retire un filtre ou vérifie l’orthographe du titre.${activeCount()?'<br><button class="btn" data-act="reset">Effacer les filtres</button>':''}</div></li>`;return}
  ul.innerHTML=r.slice(0,80).map(({w})=>{
    const recs=recommenders(w.id),b=[];
    if(isDone(w.id))b.push(`<span class="bdg done">${T[w.t].done}</span>`);
    if(isWant(w.id))b.push(`<span class="bdg">Dans ma liste</span>`);
    if(recs.length)b.push(`<span class="bdg rec">Conseillé par ${recs.length} ami${recs.length>1?'s':''}</span>`);
    return `<li><button data-open="${w.id}">${cover(w)}<span><span class="ti">${hl(w.ti,q)}</span><br><span class="meta">${metaLine(w)}, ${T[w.t].fmt(w.d)}</span>${b.length?`<span class="badges">${b.join('')}</span>`:''}</span></button></li>`}).join('');
}

let acItems=[],acIdx=-1;
function renderAC(){
  const raw=$('#q').value,q=norm(raw),ac=$('#ac');
  $('#field').classList.toggle('has',!!raw);
  let html='';acItems=[];
  if(!q){
    const rec=lsGet('sharefs-recent',[]);

  }else{
    const works=W.map(w=>({w,s:score(w,q)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,6);
    if(works.length){html+='<div class="grp">Œuvres</div>';works.forEach(({w})=>{acItems.push({k:'w',v:w.id});html+=opt(`<span class="tm t-${w.t}"></span><span><span class="ot">${hl(w.ti,q)}</span><br><span class="om">${metaLine(w)}</span></span>`)})}
    const cr=CREATORS.filter(c=>{const n=norm(c);return n.startsWith(q)||n.includes(' '+q)}).slice(0,3);
    if(cr.length){html+='<div class="grp">Créateurs</div>';cr.forEach(c=>{const n=W.filter(w=>w.c===c).length;acItems.push({k:'c',v:c});html+=opt(`<span class="ot">${hl(c,q)}</span><span class="chev">${n} œuvre${n>1?'s':''}</span>`)})}
    const gr=GENRES.filter(g=>norm(g).startsWith(q)).slice(0,3);
    if(gr.length){html+='<div class="grp">Genres</div>';gr.forEach(g=>{acItems.push({k:'g',v:g});html+=opt(`<span class="ot">${hl(g,q)}</span><span class="chev">Filtrer</span>`)})}
    if(!acItems.length)html='<div class="grp">Aucune suggestion. Valide pour lancer la recherche.</div>';
  }
  function opt(inner){const i=acItems.length-1;return `<div class="opt" role="option" id="ao${i}" data-i="${i}" aria-selected="${i===acIdx}">${inner}</div>`}
  ac.innerHTML=html;const open=!!html&&document.activeElement===$('#q');
  ac.classList.toggle('open',open);$('#q').setAttribute('aria-expanded',open);
}
function pickAC(i){
  const it=acItems[i];if(!it)return;
  if(it.k==='w'){remember($('#q').value);closeAC();openSheet(it.v);return}
  if(it.k==='q'){$('#q').value=it.v}
  if(it.k==='c'){F.creator=it.v;$('#q').value='';}
  if(it.k==='g'){F.genres.add(it.v);$('#q').value='';}
  closeAC();renderSearch();
}
function closeAC(){acIdx=-1;$('#ac').classList.remove('open');$('#q').setAttribute('aria-expanded','false');$('#q').removeAttribute('aria-activedescendant')}
function remember(v){v=v.trim();if(v.length<2)return;const r=lsGet('sharefs-recent',[]).filter(x=>x!==v);r.unshift(v);lsSet('sharefs-recent',r.slice(0,5))}

function chip(label,pressed,data){return `<button class="chip" aria-pressed="${pressed}" ${data}>${label}</button>`}

  $('#typeChips').innerHTML=chip('Tout',!F.types.size,'data-type=""')+Object.entries(T).map(([k,v])=>chip(`<span class="tm t-${k}"></span>${v.p}`,F.types.has(k),`data-type="${k}"`)).join('')+

  const decs=[...new Set(W.map(w=>dec(w.y)))].sort();
  $('#fDecades').innerHTML=decs.map(d=>chip(d==='Avant 1960'?d:'Années '+d.slice(2),F.decades.has(d),`data-dec="${d}"`)).join('');
  $('#fDur').innerHTML=[['court','Court'],['moyen','Moyen'],['long','Long']].map(([k,l])=>chip(l,F.dur.has(k),`data-dur="${k}"`)).join('');
  $('#fStatus').innerHTML=[['all','Tout'],['todo','À découvrir'],['done','Terminé'],['want','Dans ma liste'],['rec','Conseillé par mes amis']].map(([k,l])=>chip(l,F.status===k,`data-status="${k}"`)).join('');
  const cs=[...new Set(W.map(w=>w.p))].sort((a,b)=>COUNTRY[a].localeCompare(COUNTRY[b],'fr'));
  $('#fCountry').innerHTML='<option value="">Tous</option>'+cs.map(c=>`<option value="${c}" ${F.country===c?'selected':''}>${COUNTRY[c]}</option>`).join('');
  $('#fCreator').innerHTML='<option value="">Tous</option>'+CREATORS.map(c=>`<option ${F.creator===c?'selected':''}>${esc(c)}</option>`).join('');
  const pills=[];
  F.genres.forEach(g=>pills.push([esc(g),`data-rm-genre="${esc(g)}"`]));
  F.decades.forEach(d=>pills.push([d==='Avant 1960'?d:'Années '+d.slice(2),`data-rm-dec="${d}"`]));
  F.dur.forEach(d=>pills.push([d[0].toUpperCase()+d.slice(1),`data-rm-dur="${d}"`]));
  if(F.status!=='all')pills.push([{todo:'À découvrir',done:'Terminé',want:'Dans ma liste',rec:'Conseillé par mes amis'}[F.status],'data-rm-status']);
  if(F.country)pills.push([COUNTRY[F.country],'data-rm-country']);
  if(F.creator)pills.push([esc(F.creator),'data-rm-creator']);
  $('#pills').innerHTML=pills.map(([l,d])=>`<button class="pill" ${d} aria-label="Retirer le filtre ${l}">${l}</button>`).join('');
}
function renderSearch(){renderFilters();renderResults()}

/* ---------- Fil ---------- */
function renderFeed(){
  const ev=[];
  for(const [id,m] of Object.entries(members)){
    (m.shares||[]).forEach(s=>BY[s.w]&&ev.push({k:'share',who:id,w:BY[s.w],note:s.note,ts:s.ts}));
    Object.entries(m.done||{}).forEach(([w,ts])=>BY[w]&&id!==uid&&ev.push({k:'done',who:id,w:BY[w],ts}));
  }
  ev.sort((a,b)=>b.ts-a.ts);
  const el=$('#feed');
  if(!ev.length){el.innerHTML=`<div class="empty"><b>Ton fil est encore vide.</b>Recommande une œuvre que tu as aimée, puis invite tes amis avec ton code (onglet Collection) pour voir leurs conseils ici.<br><button class="btn pri" data-tab="search">Trouver une œuvre</button></div>`;return}
  el.innerHTML=ev.slice(0,60).map(e=>{
    const w=e.w,mineEv=e.who===uid;
    const line=e.k==='share'?(mineEv?'<b>Tu</b> as recommandé':`<b>${esc(nameOf(e.who))}</b> te recommande`):`<b>${esc(nameOf(e.who))}</b> a ajouté à sa collection`;
    const acts=mineEv?'':`<div class="acts">
      <button class="btn ${isWant(w.id)?'on':''}" data-want="${w.id}">${isWant(w.id)?'Dans ma liste':'Plus tard'}</button>
      <button class="btn ${isDone(w.id)?'on':''}" data-done="${w.id}">${isDone(w.id)?T[w.t].done:T[w.t].act}</button></div>`;
    return `<article class="ev"><div class="who">${avatar(e.who)}<span>${line}<br>${ago(e.ts)}</span></div>
      <button class="work" data-open="${w.id}">${cover(w)}<span><span class="ti">${esc(w.ti)}</span><br><span class="meta">${metaLine(w)}</span></span></button>
      ${e.note?`<p class="note">${esc(e.note)}</p>`:''}${acts}</article>`}).join('');
}

/* ---------- Collection ---------- */
function renderColl(){
  const ids=[uid,...others()].filter(Boolean);
  if(!collWho||!ids.includes(collWho))collWho=uid;
  $('#whoRow').innerHTML=ids.length>1?ids.map(id=>`<button class="chip" aria-pressed="${id===collWho}" data-who="${id}">${avatar(id)}${esc(nameOf(id))}</button>`).join(''):'';
  const m=collWho===uid?mine:(members[collWho]||{done:{}});
  const done=Object.entries(m.done||{}).filter(([id])=>BY[id]).sort((a,b)=>a[1]-b[1]);
  const per={f:0,s:0,l:0,j:0};done.forEach(([id])=>per[BY[id].t]++);
  $('#stats').innerHTML=Object.entries(T).map(([k,v])=>`<div class="stat"><b>${per[k]}</b><span><span class="tm t-${k}"></span>${v.p}</span></div>`).join('');
  const n=done.length,cur=[...LEVELS].reverse().find(l=>n>=l[0]),next=LEVELS.find(l=>n<l[0]);
  const prev=cur?cur[0]:0;
  $('#level').innerHTML=`<b>${cur?cur[1]:'Étagère vide'}</b>, ${n} œuvre${n>1?'s':''} terminée${n>1?'s':''}${next?`<span class="meta">, prochain palier « ${next[1]} » à ${next[0]}</span>`:''}<div class="bar"><i style="width:${next?((n-prev)/(next[0]-prev))*100:100}%"></i></div>`;
  // étagère
  const sh=$('#shelf');
  if(!n){sh.innerHTML=`<div class="shelf"><div class="plank" style="gap:3px">${'<span class="slot"></span>'.repeat(6)}<span class="meta" style="align-self:center;margin-left:10px">${collWho===uid?'Chaque œuvre terminée vient se ranger ici.':'Rien sur cette étagère pour l’instant.'}</span></div></div>${collWho===uid?'<button class="btn pri" data-tab="search" style="margin-top:10px">Trouver une œuvre</button>':''}`}
  else{
    const per_row=10,rows=[];for(let i=0;i<done.length;i+=per_row)rows.push(done.slice(i,i+per_row));
    sh.innerHTML=`<div class="shelf">${rows.map(r=>`<div class="plank">${r.map(([id])=>{const w=BY[id],h={court:84,moyen:104,long:124}[w.len];
      return `<button class="spine t-${w.t} ${id===justAdded?'new':''}" style="height:${h}px" data-open="${id}" title="${esc(w.ti)}">${esc(w.ti)}</button>`}).join('')}</div>`).join('')}</div>`;
    justAdded=null;
  }
  // séries
  const doneSet=new Set(done.map(d=>d[0]));
  const sets=SETS.map(s=>({...s,got:s.ids.filter(i=>doneSet.has(i)).length})).sort((a,b)=>(b.got/b.ids.length)-(a.got/a.ids.length));
  $('#sets').innerHTML=sets.map((s,i)=>`<div class="set ${s.got===s.ids.length?'full':''}" id="set${i}">
    <button aria-expanded="false" data-set="set${i}"><span class="sn">${esc(s.n)}</span><span class="sc">${s.got} / ${s.ids.length}</span></button>
    <div class="bar"><i style="width:${s.got/s.ids.length*100}%;background:${s.got===s.ids.length?'var(--livre)':'var(--ink)'}"></i></div>
    <ul>${s.ids.map(id=>{const w=BY[id],y=doneSet.has(id);return `<li><button data-open="${id}"><span class="ck ${y?'y':''}">${y?'✓':''}</span><span class="tm t-${w.t}"></span>${esc(w.ti)}<span class="meta">&nbsp;${w.y}</span></button></li>`}).join('')}</ul></div>`).join('');
}

/* ---------- Fiche ---------- */
let sheetId=null,lastFocus=null;
function openSheet(id,refocus=true){
  const w=BY[id];if(!w)return;sheetId=id;if(refocus)lastFocus=document.activeElement;
  const recs=recommenders(id),fins=finishers(id);
  const notes=Object.keys(members).flatMap(k=>(members[k].shares||[]).filter(s=>s.w===id&&s.note).map(s=>({k,note:s.note})));
  const alreadyShared=(mine.shares||[]).some(s=>s.w===id);
  $('#sheetIn').innerHTML=`<div class="grab"></div>
    <div class="sh-top">${cover(w)}<div><span class="meta">${T[w.t].n}</span><h3 id="shTitle">${esc(w.ti)}</h3><span class="meta">${esc(w.c)}, ${w.y}</span></div></div>
    <dl class="facts"><dt>Genres</dt><dd>${w.g.map(esc).join(', ')}</dd><dt>Durée</dt><dd>${T[w.t].fmt(w.d)}</dd><dt>Pays</dt><dd>${COUNTRY[w.p]}</dd></dl>
    <div class="sh-acts">
      <button class="btn ${isDone(id)?'on':'pri'}" data-done="${id}">${isDone(id)?T[w.t].done+' ✓':T[w.t].act}</button>
      <button class="btn ${isWant(id)?'on':''}" data-want="${id}">${isWant(id)?'Dans ma liste':'Plus tard'}</button>
      <button class="btn" id="recBtn" aria-expanded="false">${alreadyShared?'Recommander à nouveau':'Recommander'}</button>
    </div>
    <div id="recForm" hidden>
      <label class="sr" for="recNote">Ton mot pour tes amis</label>
      <textarea id="recNote" maxlength="280" placeholder="Pourquoi tes amis devraient s’y mettre ? (facultatif)"></textarea>
      <button class="btn pri" data-share="${id}">Publier la recommandation</button>
    </div>
    ${recs.length||fins.length||notes.length?`<div class="social">
      ${notes.map(n=>`<div class="line">${avatar(n.k)}<span><b>${esc(nameOf(n.k))}</b> : ${esc(n.note)}</span></div>`).join('')}
      ${recs.length?`<div class="line meta">Conseillé par ${recs.map(k=>esc(nameOf(k))).join(', ')}</div>`:''}
      ${fins.length?`<div class="line meta">${T[w.t].done} par ${fins.map(k=>esc(nameOf(k))).join(', ')}</div>`:''}</div>`:''}`;
  $('#scrim').classList.add('open');$('#sheet').classList.add('open');
  if(refocus)setTimeout(()=>$('#sheet').querySelector('button[data-done]')?.focus(),50);
}
function closeSheet(){sheetId=null;$('#scrim').classList.remove('open');$('#sheet').classList.remove('open');lastFocus?.focus?.()}

/* ---------- Actions ---------- */
function toggleDone(id){
  const w=BY[id];
  if(mine.done[id]){delete mine.done[id];toast(`Retiré de ta collection`)}
  else{mine.done[id]=Date.now();delete mine.want[id];justAdded=id;toast(`${w.ti} rejoint ta collection`)}
  save();renderAll();
}
function toggleWant(id){if(mine.want[id])delete mine.want[id];else mine.want[id]=Date.now();save();renderAll()}
function share(id){
  const note=($('#recNote')?.value||'').trim().slice(0,280);
  mine.shares=(mine.shares||[]).filter(s=>s.w!==id);
  mine.shares.unshift({id:Math.random().toString(36).slice(2,10),w:id,note,ts:Date.now()});
  mine.shares=mine.shares.slice(0,300);
  save();toast('Recommandation publiée');closeSheet();renderAll();
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

function renderAll(){
  if(uid)members[uid]=mine;
  renderFeed();renderSearch();renderColl();
  if(sheetId&&$('#sheet').classList.contains('open')){const keep=$('#recNote')?.value,show=$('#recForm')&&!$('#recForm').hidden,typing=document.activeElement===$('#recNote');openSheet(sheetId,false);if(show){$('#recForm').hidden=false;$('#recNote').value=keep||'';if(typing)$('#recNote').focus()}}
}
function setTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.dataset.tab===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  window.scrollTo(0,0);if(t==='search')setTimeout(()=>$('#q').focus(),30);
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-i]');if(!b)return;const d=b.dataset;
  if(d.i!==undefined&&b.classList.contains('opt')){pickAC(+d.i);return}
  if(d.tab!==undefined){closeSheet();setTab(d.tab);return}
  if(d.open){openSheet(d.open);return}
  if(d.done){toggleDone(d.done);return}
  if(d.want){toggleWant(d.want);return}
  if(d.share){share(d.share);return}
  if(d.who){collWho=d.who;renderColl();return}
  if(d.set){const s=document.getElementById(d.set);s.classList.toggle('open');b.setAttribute('aria-expanded',s.classList.contains('open'));return}
  if(b.id==='recBtn'){const f=$('#recForm');f.hidden=!f.hidden;b.setAttribute('aria-expanded',!f.hidden);if(!f.hidden)$('#recNote').focus();return}
  if(d.type!==undefined){if(!d.type)F.types.clear();else F.types.has(d.type)?F.types.delete(d.type):F.types.add(d.type);renderSearch();return}
  if(b.id==='openPanel'){$('#panel').classList.toggle('open');renderFilters();return}
  if(d.genre){F.genres.has(d.genre)?F.genres.delete(d.genre):F.genres.add(d.genre);renderSearch();return}
  if(d.dec){F.decades.has(d.dec)?F.decades.delete(d.dec):F.decades.add(d.dec);renderSearch();return}
  if(d.dur){F.dur.has(d.dur)?F.dur.delete(d.dur):F.dur.add(d.dur);renderSearch();return}
  if(d.status){F.status=d.status;renderSearch();return}
  if('rmGenre' in d){F.genres.delete(d.rmGenre);renderSearch();return}
  if('rmDec' in d){F.decades.delete(d.rmDec);renderSearch();return}
  if('rmDur' in d){F.dur.delete(d.rmDur);renderSearch();return}
  if('rmStatus' in d){F.status='all';renderSearch();return}
  if('rmCountry' in d){F.country='';renderSearch();return}
  if('rmCreator' in d){F.creator='';renderSearch();return}
  if(b.id==='reset'||d.act==='reset'){F.types.clear();F.genres.clear();F.decades.clear();F.dur.clear();F.status='all';F.country='';F.creator='';renderSearch();return}
  if(b.id==='closePanel'){$('#panel').classList.remove('open');renderFilters();$('#count').scrollIntoView({block:'start',behavior:'smooth'});return}
  if(b.id==='clear'){$('#q').value='';renderAC();renderResults();$('#q').focus();return}
  if(b.id==='goSearch'){setTab('search');return}
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else closeAC()}});
const q=$('#q');
q.addEventListener('input',()=>{acIdx=-1;renderAC();renderResults()});
q.addEventListener('focus',renderAC);
q.addEventListener('blur',()=>setTimeout(closeAC,150));
q.addEventListener('keydown',e=>{
  const open=$('#ac').classList.contains('open');
  if(e.key==='ArrowDown'&&acItems.length){e.preventDefault();if(!open)renderAC();acIdx=(acIdx+1)%acItems.length;markAC()}
  else if(e.key==='ArrowUp'&&acItems.length){e.preventDefault();acIdx=(acIdx-1+acItems.length)%acItems.length;markAC()}
  else if(e.key==='Enter'){e.preventDefault();if(open&&acIdx>=0)pickAC(acIdx);else{remember(q.value);closeAC();q.blur();renderResults()}}
});
function markAC(){document.querySelectorAll('#ac .opt').forEach(o=>o.setAttribute('aria-selected',+o.dataset.i===acIdx));const o=$('#ao'+acIdx);if(o){o.scrollIntoView({block:'nearest'});q.setAttribute('aria-activedescendant','ao'+acIdx)}}
$('#ac').addEventListener('mousedown',e=>e.preventDefault());
$('#sort').addEventListener('change',e=>{F.sort=e.target.value;renderResults()});
$('#fCountry').addEventListener('change',e=>{F.country=e.target.value;renderSearch()});
$('#fCreator').addEventListener('change',e=>{F.creator=e.target.value;renderSearch()});

/* ---------- Accès : connexion, prénom, cercle ---------- */
const gate=$('#gate'),gIn=$('#gateIn');
function showGate(html){gIn.innerHTML=`<div class="brand">Sharefs<span aria-hidden="true"></span></div>`+html;gate.classList.add('open');setTimeout(()=>gIn.querySelector('input')?.focus(),60)}
function hideGate(){gate.classList.remove('open')}
let pendingEmail='';
function stepEmail(err='',signup=false){
  showGate(`<h1 id="gateTitle">${signup?'Crée ton compte.':'Partage ce que tu as aimé.'}</h1><p class="sub">${signup?'Un e-mail et un mot de passe d’au moins 8 caractères.':'Connecte-toi avec ton e-mail et ton mot de passe.'}</p>
  <label class="sr" for="gEmail">E-mail</label><input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" value="${esc(pendingEmail)}">
  <label class="sr" for="gPass">Mot de passe</label><input id="gPass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="Mot de passe">
  <p class="err" role="alert">${esc(err)}</p>
  <button class="btn pri" id="${signup?'gSignup':'gLogin'}">${signup?'Créer mon compte':'Me connecter'}</button>
  <p class="or">${signup?'Déjà inscrit ?':'Pas encore de compte ?'}</p><button class="btn" id="${signup?'gToLogin':'gToSignup'}">${signup?'Me connecter':'Créer un compte'}</button>`);
}
function stepName(err=''){
  showGate(`<h1 id="gateTitle">Comment tes amis t’appellent ?</h1><p class="sub">Ce prénom s’affiche à côté de tes recommandations.</p>
  <label class="sr" for="gName">Prénom</label><input id="gName" maxlength="40" autocomplete="given-name" placeholder="Prénom">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gSaveName">Continuer</button>`);
}
function stepCircle(err=''){
  showGate(`<h1 id="gateTitle">Rejoins tes amis.</h1><p class="sub">Un cercle regroupe les amis qui voient tes conseils et ta collection.</p>
  <label class="sr" for="gJoin">Code d’invitation</label><input id="gJoin" maxlength="6" autocapitalize="characters" placeholder="Code reçu d’un ami">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gJoinBtn">Rejoindre le cercle</button>
  <p class="or">ou</p><button class="btn" id="gCreate">Créer un cercle</button>`);
}
async function busy(btn,fn){btn.disabled=true;try{await fn()}finally{if(btn.isConnected)btn.disabled=false}}
gate.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='gToSignup'){pendingEmail=$('#gEmail').value.trim();stepEmail('',true)}
  if(b.id==='gToLogin'){pendingEmail=$('#gEmail').value.trim();stepEmail()}
  if(b.id==='gLogin'||b.id==='gSignup')busy(b,async()=>{
    const signup=b.id==='gSignup';pendingEmail=$('#gEmail').value.trim();const password=$('#gPass').value;
    if(!/^\S+@\S+\.\S+$/.test(pendingEmail))return stepEmail('Cette adresse e-mail n’est pas valide.',signup);
    if(password.length<8)return stepEmail('Le mot de passe doit faire au moins 8 caractères.',signup);
    const {data,error}=signup?await sb.auth.signUp({email:pendingEmail,password}):await sb.auth.signInWithPassword({email:pendingEmail,password});
    if(error)return stepEmail(signup?'Création impossible : '+error.message:'E-mail ou mot de passe incorrect.',signup);
    if(!data.session)return stepEmail('Compte créé, mais Supabase exige une confirmation par e-mail. Désactive « Confirm email » dans Supabase puis connecte-toi.',false);
    await afterLogin(data.session)});
  if(b.id==='gSaveName')busy(b,async()=>{const n=$('#gName').value.trim();if(!n)return stepName('Indique un prénom.');
    const {error}=await sb.from('sharefs_profiles').upsert({id:uid,name:n});if(error)return stepName('Enregistrement impossible : '+error.message);
    myName=n;await ensureCircle()});
  if(b.id==='gJoinBtn')busy(b,async()=>{const code=$('#gJoin').value.trim().toUpperCase();
    const {data,error}=await sb.rpc('sharefs_join_circle',{p_code:code});
    if(error||!data)return stepCircle('Aucun cercle ne correspond à ce code.');await enterApp()});
  if(b.id==='gCreate')busy(b,async()=>{const {error}=await sb.rpc('sharefs_create_circle');
    if(error)return stepCircle('Création impossible : '+error.message);await enterApp()});
});
gate.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();gate.querySelector('.btn.pri')?.click()}});

async function afterLogin(session){
  uid=session.user.id;
  const {data}=await sb.from('sharefs_profiles').select('name,data').eq('id',uid).maybeSingle();
  if(data){myName=data.name;mine=Object.assign({done:{},want:{},shares:[]},data.data||{})}
  if(!myName)return stepName();
  await ensureCircle();
}
async function ensureCircle(){
  const {data}=await sb.from('sharefs_circle_members').select('circle_id').eq('user_id',uid);
  if(!data||!data.length)return stepCircle();
  await enterApp();
}
let channel=null,reloadT=null;
async function loadMembers(){
  const [{data:rows},{data:circ}]=await Promise.all([
    sb.from('sharefs_profiles').select('id,name,data'),
    sb.from('sharefs_circles').select('code,created_at').order('created_at')]);
  myCircles=(circ||[]).map(c=>c.code);
  const next={};names={};
  (rows||[]).forEach(r=>{next[r.id]=Object.assign({done:{},want:{},shares:[]},r.data||{});names[r.id]=r.name});
  if(next[uid]&&!saving&&!dirty)mine=next[uid];
  next[uid]=mine;members=next;renderAll();
}
async function enterApp(){
  hideGate();await loadMembers();
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('sharefs_profiles').on('postgres_changes',{event:'*',schema:'public',table:'sharefs_profiles'},()=>{clearTimeout(reloadT);reloadT=setTimeout(loadMembers,400)}).subscribe();
}

/* ---------- Compte ---------- */
function renderAccount(){
  const el=$('#account');if(!el)return;
  if(!uid||collWho!==uid){el.innerHTML='';return}
  el.innerHTML=`<h2>Mon compte</h2><div class="account">
    <div class="line"><span>Prénom</span><b>${esc(myName)}</b></div>
    ${myCircles.map(c=>`<div class="line"><span>Code d’invitation<br><span class="code">${esc(c)}</span></span><button class="btn" data-invite="${esc(c)}">Inviter</button></div>`).join('')}
    <div class="stack">
      <button class="btn" data-acc="join">Rejoindre un autre cercle</button>
      <button class="btn" data-acc="logout">Me déconnecter</button>
      <button class="btn danger" data-acc="delete">Supprimer mon compte</button>
    </div></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-invite],button[data-acc]');if(!b)return;
  if(b.dataset.invite){const code=b.dataset.invite,text=`Rejoins-moi sur Sharefs avec le code ${code}`;
    try{if(navigator.share)await navigator.share({title:'Sharefs',text});else{await navigator.clipboard.writeText(text);toast('Invitation copiée')}}catch(err){}return}
  const a=b.dataset.acc;
  if(a==='join')stepCircle();
  if(a==='logout'){await sb.auth.signOut();location.reload()}
  if(a==='delete'&&confirm('Supprimer ton compte, ta collection et tes recommandations ? Cette action est définitive.')){
    const {error}=await sb.rpc('sharefs_delete_me');if(error)return toast('Suppression impossible : '+error.message);
    await sb.auth.signOut();location.reload()}
});
const _renderColl=renderColl;renderColl=function(){_renderColl();renderAccount()};

/* ---------- Démarrage ---------- */
