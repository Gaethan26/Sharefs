<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECF2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sharefs">
<title>Sharefs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECF2;--surface:#FFFFFF;--surface2:#DDE2EB;--ink:#18213A;--muted:#596482;--line:#C9D0DD;
  --act:#18213A;--act-ink:#FFFFFF;
  --film:#E3A900;--serie:#2F6FDB;--livre:#1C9662;--jeu:#E0453A;
  --film-ink:#18213A;--hl:rgba(24,33,58,.13);
  --r-lg:22px;--r-md:14px;--r-sm:8px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11162A;--surface:#1A2138;--surface2:#242C47;--ink:#E8EBF4;--muted:#9AA3BF;--line:#323B5A;
    --act:#E8EBF4;--act-ink:#11162A;--film:#F2BC1B;--serie:#4C86EE;--livre:#2DB079;--jeu:#F0645A;--hl:rgba(232,235,244,.2);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11162A;--surface:#1A2138;--surface2:#242C47;--ink:#E8EBF4;--muted:#9AA3BF;--line:#323B5A;
  --act:#E8EBF4;--act-ink:#11162A;--film:#F2BC1B;--serie:#4C86EE;--livre:#2DB079;--jeu:#F0645A;--hl:rgba(232,235,244,.2);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--serie);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variation-settings:"wdth" 80;line-height:1}
.brand span{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:3px;background:var(--jeu);box-shadow:13px 0 0 var(--film),26px 0 0 var(--serie),39px 0 0 var(--livre);vertical-align:6px}
.iconbtn{border:0;background:var(--surface);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
h1{font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800;font-variation-settings:"wdth" 85;margin:10px 0 6px}
h2{font-size:21px;letter-spacing:-.02em;margin:28px 0 10px;font-weight:750}
.sub{color:var(--muted);margin:0 0 18px}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
.banner{background:var(--surface2);border-radius:var(--r-md);padding:12px 14px;font-size:14px;color:var(--muted);margin:8px 0 14px}
/* type marks */
.tm{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.t-f{background:var(--film)}.t-s{background:var(--serie)}.t-l{background:var(--livre)}.t-j{background:var(--jeu)}
/* feed */
.ev{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.ev .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.ev .who b{color:var(--ink);font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.ev .work{display:flex;gap:14px;align-items:stretch;margin-top:12px;border:0;background:none;padding:0;text-align:left;width:100%}
.cover{width:54px;min-height:78px;border-radius:6px 3px 3px 6px;flex:none;position:relative;display:flex;align-items:flex-end;padding:6px;color:#fff;font-weight:800;font-size:11px;line-height:1.05;overflow:hidden}
.cover.t-f{color:var(--film-ink)}
.cover::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:rgba(0,0,0,.18)}
.ev .ti{font-size:19px;font-weight:750;line-height:1.15;letter-spacing:-.01em}
.meta{font-size:14px;color:var(--muted)}
.note{margin:12px 0 0;font-size:16px;padding-left:12px;border-left:3px solid var(--line)}
.ev .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:650;font-size:15px;background:var(--surface2)}
.btn.pri{background:var(--act);color:var(--act-ink)}
.btn.on{background:var(--livre);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.empty{text-align:center;padding:36px 20px;background:var(--surface);border-radius:var(--r-lg);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.empty .btn{margin-top:14px}
/* search */
.sbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;background:var(--bg);padding-bottom:10px}
.field{position:relative}
.field input{width:100%;height:54px;border:2px solid var(--ink);background:var(--surface);border-radius:var(--r-lg);padding:0 48px 0 46px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.field input::placeholder{color:var(--muted);font-weight:500}
.field input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--serie) 35%,transparent)}
.field .lens{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none}
.field .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:none}
.field.has .clear{display:grid;place-items:center}
.ac{position:absolute;left:0;right:0;top:70px;background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:0 18px 40px -12px rgba(10,15,35,.35);max-height:min(60vh,460px);overflow:auto;display:none;padding:6px 0}
.ac.open{display:block}
.ac .grp{font-size:13px;color:var(--muted);padding:10px 16px 4px;font-weight:600}
.ac .opt{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.ac .opt[aria-selected="true"]{background:var(--surface2)}
.ac .opt .ot{font-weight:650}
.ac .opt .om{font-size:13px;color:var(--muted)}
.ac .opt .chev{margin-left:auto;font-size:13px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--act);color:var(--act-ink);border-color:var(--act)}
.chip.ftr{margin-left:auto}
.chip .cnt{background:var(--jeu);color:#fff;border-radius:999px;font-size:12px;padding:0 7px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:6px 16px 16px;margin-top:10px;display:none}
.panel.open{display:block}
.panel h3{font-size:15px;margin:14px 0 8px;font-weight:700}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.wrap .chip{font-size:14px;padding:5px 12px}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selrow label{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:0;background:var(--surface2);border-radius:999px;padding:4px 10px 4px 12px;font-size:14px}
.pill::after{content:"×";margin-left:6px;color:var(--muted)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:14px;color:var(--muted)}
.res{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.res li+li{border-top:1px solid var(--line)}
.res button{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;align-items:center}
.res .cover{width:38px;min-height:54px;font-size:0}
.res .ti{font-weight:700;font-size:17px;line-height:1.2}
.badges{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:650;border-radius:999px;padding:1px 8px;background:var(--surface2)}
.bdg.done{background:var(--livre);color:#fff}
.bdg.rec{background:var(--jeu);color:#fff}
/* collection */
.who-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.who-row::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:10px 10px 8px}
.stat b{font-size:26px;font-weight:800;line-height:1;display:block;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.level{background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:15px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s}
.shelf-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
.plank{display:flex;align-items:flex-end;gap:3px;width:100%;flex-wrap:wrap;border-bottom:10px solid var(--surface2);padding-bottom:0;margin-bottom:16px;min-height:130px}
.spine{border:0;width:30px;border-radius:3px 3px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;text-align:left;line-height:30px}
.spine.t-f{color:var(--film-ink)}
.spine.new{animation:drop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:rotate(180deg) translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.spine.new{animation:none}.bar i{transition:none}}
.slot{width:30px;height:70px;border:1.5px dashed var(--line);border-radius:3px}
.sets{display:grid;gap:10px}
.set{background:var(--surface);border-radius:var(--r-md);padding:12px 14px}
.set>button{border:0;background:none;padding:0;width:100%;text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.set .sn{font-weight:700;font-size:17px}
.set .sc{color:var(--muted);font-size:14px;white-space:nowrap}
.set.full .sn::after{content:" ✓";color:var(--livre)}
.set ul{list-style:none;padding:0;margin:10px 0 0;display:none}
.set.open ul{display:block}
.set li button{border:0;background:none;padding:6px 0;display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:15px}
.set li .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:#fff}
.set li .ck.y{background:var(--livre);border-color:var(--livre)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,28,.5);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;max-height:88vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;gap:16px}
.sh-top .cover{width:84px;min-height:122px;font-size:13px}
.sh-top h3{font-size:25px;line-height:1.08;margin:2px 0 6px;letter-spacing:-.02em;font-weight:800}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:16px 0}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.sh-acts{display:flex;gap:8px;flex-wrap:wrap}
.sh-acts .btn{flex:1 1 auto;padding:12px 16px}
textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:var(--r-md);padding:10px 12px;font-size:16px;min-height:84px;resize:vertical;margin:12px 0 8px}
.social{margin-top:18px;font-size:15px}
.social .line{display:flex;align-items:center;gap:8px;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--act);color:var(--act-ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px))}
.gate.open{display:block}
.gate .in{max-width:420px;margin:0 auto}
.gate .brand{font-size:44px;margin-bottom:26px}
.gate h1{font-size:30px}
.gate input{width:100%;height:56px;border:2px solid var(--ink);background:var(--surface);border-radius:var(--r-md);padding:0 16px;font-size:19px;margin:6px 0 12px}
.gate .btn{width:100%;padding:14px;font-size:17px;margin-top:4px}
.gate .err{color:var(--jeu);font-weight:600;min-height:1.4em;margin:6px 0}
.gate .or{text-align:center;color:var(--muted);margin:20px 0 10px}
.account{background:var(--surface);border-radius:var(--r-lg);padding:6px 16px 16px;margin-top:10px}
.account .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.account .code{font-size:22px;font-weight:800;letter-spacing:.08em}
.account .stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn.danger{background:none;color:var(--jeu)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover .ct{position:relative}
.cover.has-img .ct{visibility:hidden}
.cover.has-img::before{z-index:1;background:rgba(255,255,255,.22)}
.ev .cover{height:84px}
.res .cover{height:57px}
.more{display:block;margin:16px auto 0}
.loading{color:var(--muted);text-align:center;padding:22px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
.grid button{border:0;background:none;padding:0;text-align:left}
.grid .cover{width:100%;min-height:0;aspect-ratio:2/3;font-size:13px;border-radius:8px 4px 4px 8px}
.grid .gt{font-size:14px;font-weight:650;line-height:1.2;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid .gm{font-size:12px;color:var(--muted)}
.tools{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.mini{width:100%;height:48px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:0 14px;font-size:16px}
.mini:focus{outline:none;border-color:var(--ink)}
.spine{background-size:cover;background-position:center}
.syn{font-size:15px;line-height:1.55;margin:0 0 16px}
.sh-top .cover{width:100px;min-height:150px}
.to{margin:10px 0 2px;font-size:14px;color:var(--muted)}
.to .wrap{margin-top:6px}
.ev .del{border:0;background:none;color:var(--muted);font-size:14px;margin-left:auto;padding:4px}
.ev .who>span:not(.av){flex:1}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 10px}
.chead h2{margin:0}
.chead .row{margin:0;flex:none;overflow:visible;gap:6px}
.chead h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .chip{padding:5px 12px;font-size:14px}

/* ---------- Touches « jeu de cartes » (collection surtout) ---------- */
:root{--r1:#98A1B3;--r2:#2F7BEA;--r3:#9B4BE0;--r4:#F08A12;--gold:#E2B44C;--gold-l:#FFE3A1;--gold-d:#A9771F;--card-ink:#1B2238}
.rg{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;vertical-align:1px;background:var(--rc,var(--r1));box-shadow:0 0 0 3px color-mix(in srgb,var(--rc,var(--r1)) 22%,transparent)}
.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.rname{font-weight:750;color:var(--rc,var(--muted))}
.bdg .rg{width:8px;height:8px;box-shadow:none}
.bdg.rar{background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;gap:5px}

/* rang */
.level.rank{display:flex;gap:14px;align-items:center}
.medal{width:56px;height:56px;flex:none;display:grid;place-items:center;font-weight:800;font-size:21px;color:var(--card-ink);
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:radial-gradient(circle at 40% 30%,var(--gold-l),var(--gold) 55%,var(--gold-d))}
.rank .rt{font-weight:800;font-size:18px;line-height:1.1}
.rarities{display:flex;gap:14px;margin-top:10px}
.rar{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.rar b{color:var(--ink);font-size:17px}
.rar .rg{width:11px;height:11px}

/* grille de cartes : l'image de l'œuvre, un contour à la couleur de la rareté */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media (min-width:520px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cards button{border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.card{position:relative;display:block;width:100%;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--tc,var(--surface2));
  border:3px solid var(--rc,var(--line));box-shadow:0 6px 14px rgba(10,15,35,.18)}
.card.t-f{--tc:var(--film)}.card.t-s{--tc:var(--serie)}.card.t-l{--tc:var(--livre)}.card.t-j{--tc:var(--jeu)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.card .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10%;color:#fff;font-weight:800;font-size:14px;line-height:1.1}
.card.t-f .ph{color:#18213A}
.card.r4{box-shadow:0 6px 14px rgba(10,15,35,.18),0 0 14px rgba(240,138,18,.45)}
.card.r3{box-shadow:0 6px 14px rgba(10,15,35,.18),0 0 10px rgba(155,75,224,.3)}
.card.ghost{border-color:var(--line)}
.card.new{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.cards .gt{font-size:13px;font-weight:700;line-height:1.2;margin-top:6px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cards .gm{font-size:12px;color:var(--muted)}
.sh-top .card{width:96px;flex:none}
.reveal .flip .card{border-width:4px}

/* dos de carte */

/* étagère : gemme de rareté en haut de tranche */

/* choix de la rareté */
.pick{margin:18px -4px 6px}

.deck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;perspective:1000px}
.pc{border:0;padding:0;background:none;aspect-ratio:2/3;cursor:pointer;color:#fff;min-width:0}
.pin{position:relative;display:block;width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .2s ease}
.pback,.pface{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid #fff;box-shadow:0 10px 20px -6px rgba(10,15,35,.35)}
.pback{transform:rotateY(180deg);background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.95) 0 9%,transparent 10%),repeating-radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--rc) 70%,#000) 0 7px,var(--rc) 7px 14px)}

.pc[aria-pressed="true"] .pin{transform:translateY(-6px)}
.deal .pin{animation:dealpc .95s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 90ms)}

@keyframes dealpc{
  0%{transform:translateX(calc((1.5 - var(--i)) * (100% + 8px))) translateY(40px) scale(.7) rotateY(180deg) rotateZ(calc((var(--i) - 1.5) * 4deg))}
  55%{transform:translateY(-10px) rotateY(180deg)}
  100%{transform:none}}
.deck.choosing .pc .pin{transition:transform .35s ease,opacity .3s}
.deck.choosing .pc:not(.chosen){filter:grayscale(.6) brightness(.85);transition:filter .3s}
.deck.choosing .pc:not(.chosen) .pin{transform:scale(.92)}

/* révélation */
.reveal{position:fixed;inset:0;z-index:70;display:none;place-items:center;cursor:pointer}

.reveal .flip{position:relative;aspect-ratio:5/7;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;animation:flip 1s .2s cubic-bezier(.3,1.3,.5,1) both}
.reveal .flip>*{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;transform:translateZ(.1px)}

.reveal .tap{margin-top:8px;color:#AAB2CC;font-size:14px;animation:fadeup .5s 1.4s both}
@keyframes flip{from{transform:rotateY(180deg) scale(.6)}to{transform:rotateY(0) scale(1)}}
@keyframes burst{0%{box-shadow:0 0 0 0 var(--rc);opacity:1}100%{box-shadow:0 0 0 70vmax transparent;opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.card.r4 .frame,.card.new,.reveal .flip,.reveal .burst,.reveal .cap,.reveal .tap{animation:none}}

:root{--danger:#B42318;
  --r1:#8C95A6;--r2:#3BA0F0;--r3:#9B4BE0;--r4:#F28C1B;
  --rt1:#5B6475;--rt2:#1A78C2;--rt3:#7A2FC4;--rt4:#C25E06;
  --f1:linear-gradient(145deg,#C3C9D3,#8C95A6 50%,#6B7383);
  --f2:linear-gradient(145deg,#8FD0FF,#3BA0F0 50%,#1C74C4);
  --f3:linear-gradient(145deg,#CFA2F6,#9B4BE0 50%,#6E28B4);
  --f4:linear-gradient(145deg,#FFD27A,#F28C1B 50%,#D0600A)}
.r1{--rc:var(--r1);--rf:var(--f1);--rt:var(--rt1)}.r2{--rc:var(--r2);--rf:var(--f2);--rt:var(--rt2)}.r3{--rc:var(--r3);--rf:var(--f3);--rt:var(--rt3)}.r4{--rc:var(--r4);--rf:var(--f4);--rt:var(--rt4)}
:focus-visible{outline-color:var(--ink)}
.field input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ink) 14%,transparent)}
.btn.on{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ink) 25%,transparent)}
.btn.icon.saved{background:var(--act);color:var(--act-ink)}
.btn.danger{color:var(--danger)}
.gate .err{color:var(--danger)}
.chip .cnt{background:var(--ink);color:var(--surface)}
.bdg.done{background:var(--surface2);color:var(--ink)}
.bdg.rec{background:var(--ink);color:var(--surface)}
.medal{background:var(--act);color:var(--act-ink)}
.cardback{background:radial-gradient(circle at 50% 50%,transparent 22%,#C9D0DA 23% 25%,transparent 26% 33%,#8E97A6 34% 35%,transparent 36%),repeating-conic-gradient(#2A2F3D 0 15deg,#1F2330 15deg 30deg);box-shadow:inset 0 0 0 4px #C9D0DA,inset 0 0 0 7px #1F2330,0 6px 14px rgba(0,0,0,.3)}
.cardback::after{color:#E6EAF0}
/* raretés : gris, bleu ciel, violet, orange, en dégradés brillants */
.rg{background:var(--rf,var(--f1));box-shadow:0 0 0 1px rgba(0,0,0,.06)}
.rname{color:var(--rt,var(--muted));font-weight:750}
.card.r1,.card.r2,.card.r3,.card.r4{border-color:transparent;background:linear-gradient(var(--tc),var(--tc)) padding-box,var(--rf) border-box}
.sp.r2::after,.sp.r3::after,.sp.r4::after,.sp.book.r2::after,.sp.book.r3::after,.sp.book.r4::after{background:var(--rf)}
.irar{background:color-mix(in srgb,var(--rc) 14%,transparent);color:var(--rt)}
/* fil : la couleur du type seulement en contour */
.ev{border:2px solid color-mix(in srgb,var(--tc,var(--line)) 55%,transparent)}
.ev .note{border-left-color:color-mix(in srgb,var(--tc,var(--line)) 70%,transparent)}
/* « T'en as pensé quoi ? » : cartes pleines et brillantes */
.pback{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.9) 0 8%,transparent 9%),repeating-radial-gradient(circle at 50% 50%,rgba(0,0,0,.14) 0 6px,transparent 6px 12px),var(--rf);border:2px solid rgba(0,0,0,.12)}
.pface{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.3) 45%,transparent 60%),var(--rf);color:#fff;border:2px solid rgba(0,0,0,.12);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ps{font-size:clamp(12.5px,3.4vw,15px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
.pface small{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.85}
.pc[aria-pressed="true"] .pface{box-shadow:0 0 0 3px var(--ink),0 14px 26px -8px var(--rc)}
.pick p{font-weight:750}
/* CTA collection */
.cta{display:flex;align-items:center;gap:14px;width:100%;margin:22px 0 0;padding:16px 18px;border:0;border-radius:var(--r-lg);background:var(--act);color:var(--act-ink);text-align:left;position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--brandbar)}
.cta>span{flex:1;display:flex;flex-direction:column;gap:2px}
.cta b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.cta span span{font-size:15px;opacity:.8}
.cta svg{flex:none;width:38px;height:38px;padding:8px;border-radius:50%;background:color-mix(in srgb,var(--act-ink) 14%,transparent)}
/* déco de l'étagère en tons neutres */
.plant::before{background:linear-gradient(#B98A6A,#8C6448)}
.stack i:nth-child(1){background:#4F6D5B}.stack i:nth-child(2){background:#D8CBA8}.stack i:nth-child(3){background:#8C6B4A}
.lamp::after{background:linear-gradient(#7A6A58,#5C4E40)}
.chead{flex-wrap:wrap;row-gap:8px}
.chead h2{overflow:visible;text-overflow:clip}
/* interrupteur Vu / Lu / Fini */
.tgl{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;transition:border-color .2s,color .2s}
.tgl .trk{position:relative;flex:none;width:44px;height:28px;border-radius:999px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .2s}
.tgl .knob{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.tgl.on{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.tgl.on .trk{background:var(--act);box-shadow:none}
.tgl.on .knob{transform:translateX(16px);background:var(--act-ink)}
.tgl.on .knob::after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid var(--act);border-width:0 2px 2px 0;transform:rotate(45deg)}
.sh-acts{align-items:center}
.sh-acts .tgl{flex:1 1 auto;justify-content:flex-start}
/* bouton et formulaire de recommandation */
.btn.recb{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--act);color:var(--act-ink)}
.btn.recb[aria-expanded="true"]{background:var(--surface2);color:var(--ink)}
.recf{margin-top:14px;padding:16px;border-radius:var(--r-lg);background:var(--surface2)}
.recf .rh{font-weight:800;font-size:16px;margin-bottom:10px}
.rto{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.rto::-webkit-scrollbar{display:none}
.pickw{flex:none;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;color:var(--muted);font-size:12px;font-weight:650}
.pickw .av{width:46px;height:46px;font-size:18px;position:relative;box-shadow:0 0 0 2px var(--surface2),0 0 0 3.5px transparent;transition:box-shadow .15s}
.pickw .av.all{display:grid;place-items:center;background:var(--surface);color:var(--ink)}
.pickw .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickw[aria-pressed="true"]{color:var(--ink)}
.pickw[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--surface2),0 0 0 4px var(--ink)}
.pickw[aria-pressed="true"] .av::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--act);color:var(--act-ink);border:2px solid var(--surface2)}
.recf .ta{position:relative;margin-top:8px}
.recf textarea{margin:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 12px 26px;min-height:96px}
.recf textarea:focus{outline:none;border-color:var(--ink)}
.recf .cc{position:absolute;right:12px;bottom:8px;font-size:12px;color:var(--muted)}
.recf .send{width:100%;margin-top:12px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px}
/* fil : signet en haut à droite */
.ev{position:relative}
.ev .bmk{position:absolute;top:10px;right:10px;z-index:1}
.ev .bmk .btn.icon{padding:8px 10px}
.ev.hasbm .who{padding-right:46px}
/* petite étagère décorative du fil */
.ledge{position:relative;height:66px;margin:2px 0 16px}
.ledge::after{content:"";position:absolute;left:0;right:0;bottom:0;height:11px;border-radius:3px;background:linear-gradient(#EDBE88,#CF9760 50%,#AE7744);box-shadow:0 7px 9px -5px rgba(40,20,5,.45)}
.ledge .deco{bottom:11px}
.ledge .minisp{position:absolute;bottom:11px;display:flex;align-items:flex-end;gap:2px}
.ledge .minisp i{display:block;width:9px;border-radius:2px 2px 0 0;box-shadow:inset -2px 0 0 rgba(0,0,0,.15)}
.ledge .minisp i:nth-child(1){height:36px}.ledge .minisp i:nth-child(2){height:42px}.ledge .minisp i:nth-child(3){height:32px}.ledge .minisp i:nth-child(4){height:38px;transform:rotate(8deg);transform-origin:bottom left;margin-left:2px}
.ledge.end{margin:20px 0 4px;height:58px}
.ledge .lt{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
/* tranches illustrées par l'image de l'œuvre */
.sp.im{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,.06) 28%,rgba(255,255,255,.14) 50%,rgba(0,0,0,.06) 72%,rgba(0,0,0,.42)),var(--im) center/cover no-repeat}
.sp.im span{color:#fff;background:rgba(14,17,28,.6);padding:6px 3px;border-radius:3px;max-height:calc(100% - 46px)}
.sp.im.book.v1 span{background:rgba(255,250,235,.92);color:#2A2A33}
/* étagère par type : éclairage chaud, objets de rappel */
.case{background:linear-gradient(90deg,#6E4426,#8A5A34 5%,#845532 95%,#673F22)}
.case::before{background:linear-gradient(#A97446,#7E512D 70%,#6E4426)}
.case::after{background:linear-gradient(#6E4426,#4F2F18)}
.shelfrow{min-height:162px;padding:22px 10px 0;
  background:radial-gradient(70% 55% at 55% 0%,rgba(255,214,150,.42),transparent 75%),linear-gradient(180deg,rgba(30,14,4,.2),rgba(30,14,4,.45)),repeating-linear-gradient(90deg,#6B4429 0 10px,#734A2D 10px 21px,#673F26 21px 33px);
  box-shadow:inset 0 10px 16px -10px rgba(20,8,2,.7),inset 10px 0 12px -10px rgba(20,8,2,.6),inset -10px 0 12px -10px rgba(20,8,2,.6)}
.shelfrow::before{content:"";position:absolute;top:5px;left:32%;right:10%;height:3px;border-radius:2px;background:#FFF6E2;box-shadow:0 0 10px 3px rgba(255,214,150,.75),0 6px 22px 6px rgba(255,214,150,.25)}
.board{background:linear-gradient(#C08A55,#9C6A3C 55%,#7E522D)}
.sdeco{position:absolute;right:12px;bottom:0;display:block;line-height:0;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.sdeco.plantwrap{right:16px}
.sp{box-shadow:2px 0 3px rgba(10,4,0,.45),inset 0 0 0 1px rgba(0,0,0,.25)}
.sp.im.disc::before,.sp.im.box::before,.sp.im.game::before{display:none}
.sp.im.disc,.sp.im.box{background:linear-gradient(90deg,rgba(10,10,14,.75),rgba(10,10,14,.1) 18%,rgba(255,255,255,.14) 50%,rgba(10,10,14,.1) 82%,rgba(10,10,14,.75)),var(--im) center/cover no-repeat;border-radius:2px}
.sp.im.game{background:linear-gradient(90deg,rgba(10,10,14,.7),rgba(10,10,14,.1) 20%,rgba(255,255,255,.12) 50%,rgba(10,10,14,.1) 80%,rgba(10,10,14,.7)),var(--im) center/cover no-repeat}
.sp.im.disc span,.sp.im.box span,.sp.im.game span{top:50%;max-height:calc(100% - 22px)}
/* cartes : une ligne par type, 4 par ligne */
.crow+.crow{margin-top:18px}
.crh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--ink);margin:0 0 8px}
.crh .n{font-weight:600;color:var(--muted)}
.cards,.crow .cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.cards .gt{font-size:12px}
.cards .gm{font-size:11px}
.shelfrow{gap:6px}
.sp{transform:rotate(var(--tilt,0deg));transform-origin:bottom center}
.sp:hover,.sp:focus-visible{transform:rotate(var(--tilt,0deg)) translateY(-8px)}
.sp.landed{animation:landsp2 1.3s ease-out}
@keyframes landsp2{0%{transform:rotate(var(--tilt,0deg)) translateY(-16px);box-shadow:0 0 18px 4px var(--rc,#fff)}100%{transform:rotate(var(--tilt,0deg))}}
/* ===== défis ===== */
nav.tabs button{position:relative}
.nbadge{position:absolute;top:6px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:11px;font-weight:800;line-height:17px}
.chals{display:flex;flex-direction:column;gap:12px}
.chal{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 16px}
.ch-top{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.ch-top b{color:var(--ink)}
.ch-vs{display:grid;place-items:center;width:20px;height:20px;color:var(--muted)}
.ch-l{flex:1;min-width:0;margin-left:4px}
.ch-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface2);color:var(--ink)}
.ch-tag.live{background:var(--act);color:var(--act-ink)}
.ch-works{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.chw{position:relative;border:0;background:none;padding:0;text-align:left;color:inherit;min-width:0}
.chw .card{border-width:2px;opacity:.55}
.chw.ok .card{opacity:1}
.chw.empty{aspect-ratio:2/3;border:2px dashed var(--line);border-radius:12px}
.chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--act);color:var(--act-ink)}
.chw-t{display:block;font-size:11px;font-weight:650;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ch-bar{height:6px;border-radius:99px;background:var(--surface2);margin-top:12px;overflow:hidden}
.ch-bar i{display:block;height:100%;border-radius:99px;background:var(--act)}
.ch-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.ch-x{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px 0 0}
.ch-empty,.rk-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 12px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-lg)}
.ch-empty p,.rk-empty p{margin:0}
.ch-empty svg,.rk-empty svg{width:28px;height:28px}
.rk-title{display:flex;align-items:center;gap:8px}
.rk{background:var(--surface);border-radius:var(--r-lg);overflow:hidden}
.rk-h,.rk-r{display:grid;grid-template-columns:1fr 64px 84px;align-items:center;gap:8px;padding:10px 14px}
.rk-h{font-size:12px;font-weight:700;color:var(--muted)}
.rk-r{border-top:1px solid var(--line)}
.rk-r.me{background:var(--surface2)}
.rk-n{display:flex;align-items:center;gap:8px;min-width:0}
.rk-n i{font-style:normal;font-weight:800;width:18px;color:var(--muted)}
.rk-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-p{font-size:20px;font-weight:800;text-align:right}
.rk-p small{font-size:11px;font-weight:600;color:var(--muted)}
.rk-c{text-align:right;font-size:12px;color:var(--muted);opacity:.7}
.rk-legend{font-size:12px;color:var(--muted);margin:8px 2px 0}
.chf-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.chf-h h3{margin:0;font-size:22px;letter-spacing:-.02em}
.chf-h p{margin:2px 0 0}
.chf-i{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--act);color:var(--act-ink)}
.chslots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.chs{position:relative;min-width:0}
.chs.empty{aspect-ratio:2/3;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:22px}
.chs-x{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--act);color:var(--act-ink);font-size:15px;line-height:1}
.chr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.chr .cover{width:32px;min-height:46px;height:46px}
.chr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.chr-t b{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chr .btn.icon{font-size:20px;line-height:1;padding:6px 12px}
.chcoll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.chcoll::-webkit-scrollbar{display:none}
.chcoll button{flex:none;width:62px;border:0;background:none;padding:0}
.sh-acts .btn.icon{display:inline-flex}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r))}}
.card.egg{background:var(--f4) !important}
/* ===== fil ===== */
.day{display:flex;align-items:center;gap:10px;margin:16px 2px 10px;font-size:12px;font-weight:700;color:var(--muted)}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.day:first-child{margin-top:2px}
.pt{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:11px;font-weight:800;vertical-align:1px}
.evf{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 16px 0}
.ev:not(.hasbm) .evf{justify-content:flex-end}
.cmtb{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface2);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.cmtb.on{background:var(--act);color:var(--act-ink)}
.cmts{margin:12px 16px 0;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cm{display:flex;align-items:flex-start;gap:8px}
.cm .av,.cmw .av{width:28px;height:28px;font-size:12px}
.cb{flex:1;min-width:0;background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.ct{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.cmx{border:0;background:none;color:var(--muted);font-size:16px;padding:2px 4px}
.cmw{display:flex;align-items:center;gap:8px}
.cmi{flex:1;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);padding:0 14px;font-size:15px}
.cmi:focus{outline:none;border-color:var(--ink)}
.cms{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--act);color:var(--act-ink);display:grid;place-items:center}
.evm{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:inherit;background:var(--surface);border-radius:var(--r-lg);padding:8px 10px 8px 12px;margin-bottom:12px;border:2px solid color-mix(in srgb,var(--tc,var(--line)) 40%,transparent)}
.evm .av{width:28px;height:28px;font-size:12px}
.evm-t{flex:1;min-width:0;font-size:14px;color:var(--muted);line-height:1.35}
.evm-t b{color:var(--ink)}
.evm-r{display:inline-flex;align-items:center;gap:5px;margin-left:6px;font-size:12px;font-weight:700;color:var(--rt)}
.evm .cover{width:30px;min-height:44px;height:44px;flex:none}
.evm-i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface2);color:var(--ink)}
.evw{border-color:var(--line)}
.evc{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px 16px;margin-bottom:12px}
.evc-h{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.evc-h b{color:var(--ink)}
.evc-h small{font-size:12px}
.evc-w{display:flex;gap:6px;margin:12px 0}
.evc-w button{border:0;background:none;padding:0;opacity:.55}
.evc-w button.ok{opacity:1}
.evc-w .cover{width:44px;min-height:64px;height:64px}
/* ===== signets ===== */
.wl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wl li{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--r-lg);padding:10px 10px 10px 12px;border:2px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.wl-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;color:inherit}
.wl-open .cover{width:46px;min-height:68px;height:68px}
.wl-t{display:flex;flex-direction:column;min-width:0}

/* ===== police du site pour les raretés et le grimoire ===== */
:root{--rfont:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
/* ===== raretés inspirées des cartes de collection ===== */
.gem{flex:none;display:block;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--rc) 70%,transparent))}

  color:var(--ink);background:var(--surface);border:1.5px solid color-mix(in srgb,var(--rc,var(--line)) 45%,transparent);box-shadow:none}

.gfilter .gf-all[aria-pressed="true"]{background:var(--act);color:var(--act-ink);border-color:var(--act)}
/* cartes de collection : cadre métal, médaillon, couronne */
.card.r1,.card.r2,.card.r3,.card.r4{border-width:3px}
.card.r1::after,.card.r2::after,.card.r3::after,.card.r4::after{content:"";position:absolute;inset:2px;border-radius:9px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55),inset 0 -26px 22px -18px rgba(0,0,0,.45);pointer-events:none;z-index:1}
.card.r2{box-shadow:0 6px 14px rgba(10,15,35,.18),0 0 10px rgba(59,160,240,.35)}
.card.r3{box-shadow:0 6px 14px rgba(10,15,35,.18),0 0 14px rgba(155,75,224,.5)}
.card.r4{box-shadow:0 6px 14px rgba(10,15,35,.18),0 0 18px rgba(242,140,27,.6)}
.cmed{position:absolute;left:50%;bottom:5px;z-index:2;width:20px;height:20px;transform:translateX(-50%);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),transparent 50%),var(--rf);box-shadow:0 0 0 1.5px rgba(255,255,255,.8),0 2px 4px rgba(0,0,0,.35)}
.cmed .gem{filter:none}
.ccrown{position:absolute;left:50%;top:3px;z-index:2;transform:translateX(-50%);line-height:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.sh-top .card .ccrown svg,.chw .card .ccrown svg{width:22px;height:15px}
/* choix de l'avis : cartes au cadre de rareté, gemme en tête */
.pface{justify-content:center;gap:6px;padding:10px 6px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pgem{line-height:0;margin-bottom:2px}
.pgem .gem{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
.pgem .gem path:first-child{fill:#fff;opacity:.95}
.ps{font-family:var(--rfont);font-size:clamp(12.5px,3.4vw,15px);font-weight:800;letter-spacing:-.01em}
.pface small{font-family:var(--rfont);font-size:11px;font-weight:700;letter-spacing:0;opacity:.9}
.pface small::before,.pface small::after{display:none}
/* révélation */
.reveal .cap .cgem{display:block;line-height:0;margin:0 auto 6px;width:34px}
.reveal .cap .cgem .gem{width:34px;height:34px;filter:drop-shadow(0 0 10px var(--rc))}
.reveal .cap .rname{font-family:var(--rfont);font-size:32px;font-weight:800;letter-spacing:-.01em;gap:0}
.reveal .cap .rname::before,.reveal .cap .rname::after{display:none}
.irar2 .rtag{font-size:13px}
/* ===== bouton « Mon grimoire » ===== */
.gclosed{display:flex;align-items:center;gap:12px;height:auto;padding:8px 18px 8px 4px;border-radius:var(--r-lg);overflow:visible;
  background:radial-gradient(60% 120% at 18% 50%,rgba(232,196,106,.32),transparent 70%),var(--surface);box-shadow:0 12px 26px -16px rgba(40,20,5,.55)}
.gclosed::before{display:none}
.gsvg{flex:none;margin:-14px -4px -10px 0;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.gclosed:hover .gsvg,.gclosed:focus-visible .gsvg{transform:rotate(-5deg) translateY(-4px) scale(1.04)}
.gcl-t{flex:1;min-width:0;white-space:nowrap;font-family:var(--rfont);font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.gcl-go{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--act);color:var(--act-ink)}
.gsvg .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
.gsvg .s2{animation-delay:.8s}.gsvg .s3{animation-delay:1.6s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
.ghead,.gfoot span{font-family:var(--rfont)}
.ghead{letter-spacing:-.01em}
/* ===== dos des boîtiers ===== */
.box{position:fixed;inset:0;z-index:74;display:none;background:rgba(8,10,20,.82);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.box.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.bx-stage{perspective:1100px}
.bx3{background:none;position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;cursor:pointer}
.bx-f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.bx-f.front,.bx-f.back{inset:0;border-radius:4px}
.bx-f.front{transform:translateZ(calc(var(--d)/2));background:var(--tc)}
.bx-f.front img{width:100%;height:100%;object-fit:cover;display:block}
.bx-f.front .ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:14px;color:#fff;font-weight:800;font-size:20px}
.bx3.t-f .bx-f.front .ph{color:#18213A}
.bx3:not(.t-l) .bx-f.front::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 30%,transparent 70%,rgba(255,255,255,.1));box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}
.bx-f.back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));display:flex;flex-direction:column}
.bx-f.side,.bx-f.side2{top:0;height:100%;width:var(--d);left:calc((var(--w) - var(--d))/2)}
.bx-f.side{transform:rotateY(-90deg) translateZ(calc(var(--w)/2))}
.bx-f.side2{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:linear-gradient(90deg,#EDE3CC,#D6C8A6)}
.bx3:not(.t-l) .bx-f.side2{background:linear-gradient(90deg,#2A2D36,#15171C)}
.bx-f.top,.bx-f.bottom{left:0;width:100%;height:var(--d);top:calc((var(--h) - var(--d))/2);background:#E8DCC0}
.bx3:not(.t-l) .bx-f.top,.bx3:not(.t-l) .bx-f.bottom{background:#1C1F27}
.bx-f.top{transform:rotateX(90deg) translateZ(calc(var(--h)/2))}
.bx-f.bottom{transform:rotateX(-90deg) translateZ(calc(var(--h)/2))}
.bx-band{flex:none;height:12px;background:var(--tc)}
.bx-in{flex:1;display:flex;flex-direction:column;gap:6px;padding:14px 14px 12px;min-height:0}
.bx-t{font-size:17px;line-height:1.15;font-weight:800}
.bx-m{font-size:11px;opacity:.75}
.bx-in .rtag{align-self:flex-start;font-size:11px}
.bx-s{flex:1;min-height:0;overflow:hidden;font-size:11px;line-height:1.45;opacity:.9;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical}
.bx-code{flex:none;align-self:flex-end;width:62px;height:30px;border-radius:2px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 3px,#111 3px 4px,#fff 4px 6px,#111 6px 9px,#fff 9px 10px);box-shadow:0 0 0 4px #fff}
.bk-f,.bk-s{background:linear-gradient(160deg,#20232C,#121419);color:#EEF0F5}
.bk-j{background:linear-gradient(160deg,#1A2233,#0F1420);color:#EEF0F5}
.bk-l{background:radial-gradient(120% 90% at 50% 20%,#FBF4E2,#E9D9B4);color:#2B2216}
.bk-l .bx-t{font-family:Georgia,"Times New Roman",serif}
.bk-l .bx-s{font-family:Georgia,"Times New Roman",serif;font-size:11.5px}
.bk-l .bx-code{box-shadow:0 0 0 4px #FBF4E2}
.bk-f .rtag,.bk-s .rtag,.bk-j .rtag{color:#fff;background:color-mix(in srgb,var(--rc) 30%,transparent)}
.bx-acts{display:flex;gap:8px}
.bx-acts .btn{background:rgba(255,255,255,.14);color:#fff}
.bx-acts .btn.pri{background:#fff;color:#18213A}
.bx-acts .btn.icon{font-size:22px;line-height:1;padding:7px 14px}
@media (prefers-reduced-motion:reduce){.gsvg .spark{animation:none}}
</style>
</head>

<div class="app">
  <header class="top">
    <div class="brand" aria-label="Sharefs">Sharefs<span aria-hidden="true"></span></div>
    <button class="iconbtn" id="goSearch" aria-label="Rechercher une œuvre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>

  <section class="view on" id="v-feed" aria-labelledby="h-feed">
    <h1 id="h-feed">Tu verras c’est d’la frappe !</h1>

    <div class="ledge" aria-hidden="true"><span class="deco stack" style="left:10px"><i></i><i></i><i></i></span><span class="minisp" style="left:74px"><i class="t-f"></i><i class="t-s"></i><i class="t-l"></i><i class="t-j"></i></span><span class="deco plant" style="right:64px"><i></i><i></i><i></i><i></i></span><span class="deco lamp" style="right:16px"></span></div>

  </section>

  <section class="view" id="v-search" aria-labelledby="h-search">

    <div class="sbox">
      <div class="field" id="field">
        <svg class="lens" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Titre, auteur, studio…" role="combobox" aria-expanded="false" aria-controls="ac" aria-autocomplete="list" aria-label="Rechercher une œuvre">
        <button class="clear" id="clear" aria-label="Effacer la recherche"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="ac" id="ac" role="listbox" aria-label="Suggestions"></div>

  <section class="view" id="v-chal" aria-labelledby="h-chal">

  <section class="view" id="v-coll" aria-labelledby="h-coll">

      <label class="sr" for="collQ">Chercher une carte</label>

    <button class="cta" data-explore><span><b>T’as déjà vu des trucs ??</b><span>Complète ta collection !</span></span><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>

</div>

  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Recherche</button>

  <button data-tab="coll"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 5.5l3.6-1 3.4 14.5-3.6 1z"/></svg>Collection</button>

<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gateTitle"><div class="in" id="gateIn"></div></div>

<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-label="Nouvelle carte" tabindex="-1"></div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Images"><div class="strip" id="lbStrip"></div><div class="pos" id="lbPos"></div><button class="x" id="lbClose" aria-label="Fermer">×</button></div>

<div class="box" id="box" role="dialog" aria-modal="true" aria-label="Œuvre"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script>
/* ---------- Base ---------- */
const CFG=window.SHAREFS_CONFIG||{};
const API=(CFG.apiBase||'').replace(/\/$/,'')+'/api';
const T={
  f:{n:'Film',p:'Films',done:'Vu',act:'J’ai vu',did:'a vu',fmt:m=>`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`},
  s:{n:'Série',p:'Séries',done:'Terminée',act:'J’ai terminé',did:'a terminé',fmt:x=>x+(x>1?' saisons':' saison')},
  l:{n:'Livre',p:'Livres',done:'Lu',act:'J’ai lu',did:'a lu',fmt:x=>x+' pages'},
  j:{n:'Jeu',p:'Jeux',done:'Fini',act:'J’ai fini',did:'a fini',fmt:()=>''}
};
const RAR=[null,{n:'Commune',s:'Une bouse frérot'},{n:'Rare',s:'Mouuais..'},{n:'Épique',s:'Étonnant\u00a0!'},{n:'Légendaire',s:'Messi prime'}];
const RANKS=[[0,'Page blanche'],[1,'C’est le petit Robert'],[10,'Mike Horn d’intérieur'],[25,'Pilier de vidéoclub'],[50,'Encyclopédie sur pattes'],[100,'Zidane']];
const ICON={
  f:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10h18v10H3z"/><path d="M2.6 5.3 19.8 2.6l.6 3.9L3.2 9.2z"/></svg>',
  s:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8 2.5 12 6.5l4-4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 5c3.2-1.2 6.3-1 9 .7V21c-2.7-1.6-5.8-1.8-9-.7zM21.5 5c-3.2-1.2-6.3-1-9 .7V21c2.7-1.6 5.8-1.8 9-.7z"/></svg>',
  j:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 015 5v.5a4 4 0 01-7.2 2.4L13.6 13h-3.2l-1.2 1.9A4 4 0 012 12.5V12a5 5 0 015-5z"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'`]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const REG=(()=>{try{return new Intl.DisplayNames(['fr'],{type:'region'})}catch(e){return null}})();
const country=c=>{if(!c)return'';try{return REG?REG.of(c):c}catch(e){return c}};

/* ---------- Serveur ---------- */
let token=lsGet('sharefs-token','');
async function call(method,path,body){
  let r;
  try{r=await fetch(API+'/'+path,{method,headers:{'Content-Type':'application/json',...(token?{'X-Sharefs-Token':token}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw Object.assign(new Error('offline'),{code:'offline'})}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!path.startsWith('auth/')){token='';lsSet('sharefs-token','');stepEmail('Ta session a expiré, reconnecte-toi.')}
  if(!r.ok)throw Object.assign(new Error(j.error||'http_'+r.status),{code:j.error||'http_'+r.status,status:r.status});
  return j;
}
function api(path,params){const qs=new URLSearchParams(Object.entries(params||{}).filter(([,v])=>v!==''&&v!=null)).toString();return call('GET',path+(qs?'?'+qs:''))}
const ERR={bad_email:'Cette adresse e-mail n’est pas valide.',weak_password:'Le mot de passe doit faire au moins 8 caractères.',email_taken:'Un compte existe déjà avec cet e-mail.',
  bad_credentials:'E-mail ou mot de passe incorrect.',too_many_attempts:'Trop d’essais. Réessaie dans un quart d’heure.',bad_code:'Code incorrect ou expiré.',
  unknown_code:'Aucun cercle ne correspond à ce code.',bad_recipients:'Un destinataire ne fait pas partie de tes cercles.',offline:'Pas de connexion au serveur.',server_error:'Erreur du serveur. Réessaie.'};
const msg=e=>ERR[e?.code]||('Erreur : '+(e?.code||e?.message||'inconnue'));

/* ---------- État ---------- */
let uid=null,myName='',myCircles=[];
let members={};
let mine={done:{},want:{},works:{},rate:{}};
let recs=[];
let names={};
const WK={};
function normData(d){d=d&&typeof d==='object'&&!Array.isArray(d)?{...d}:{};for(const k of ['done','want','works','rate'])if(!d[k]||Array.isArray(d[k]))d[k]={};delete d.shares;return d}
function reg(w){
  if(!w||!w.id)return w;
  const o=WK[w.id];if(!o){WK[w.id]={...w};return WK[w.id]}
  for(const [k,v] of Object.entries(w))if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length))o[k]=v;
  return o;
}
const snap=w=>Object.fromEntries(Object.entries({id:w.id,t:w.t,ti:w.ti,y:w.y,c:w.c,img:w.img,g:(w.g||[]).slice(0,3),d:w.d,p:w.p}).filter(([,v])=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)));

let saving=false,dirty=false;
async function save(){
  if(!uid)return;dirty=true;if(saving)return;saving=true;
  while(dirty){dirty=false;try{await call('PUT','me',{data:mine})}catch(e){toast(msg(e));break}}
  saving=false;
}
const others=()=>Object.keys(members).filter(k=>k!==uid);
const nameOf=id=>id===uid?(myName||'Toi'):(names[id]||'Un ami');
function avatar(id){const n=nameOf(id);return `<span class="av" aria-hidden="true">${esc((n[0]||'?').toUpperCase())}</span>`}
const dataOf=id=>id===uid?mine:(members[id]?.data||normData());

/* ---------- Œuvres et cartes ---------- */
const short=t=>String(t||'').length>24?String(t).slice(0,22)+'…':String(t||'');
const cover=w=>`<span class="cover t-${w.t}${w.img?' has-img':''}" aria-hidden="true">${w.img?`<img src="${esc(w.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:''}<span class="ct">${esc(short(w.ti))}</span></span>`;
const GEM=(r,s=14)=>`<svg class="gem" viewBox="0 0 24 24" width="${s}" height="${s}" aria-hidden="true"><path d="M12 2 21.5 9.5 12 22 2.5 9.5z" fill="var(--rc)"/><path d="M12 2 16.6 9.5H7.4z" fill="#fff" opacity=".6"/><path d="M2.5 9.5h4.9L12 22z" fill="#000" opacity=".2"/><path d="M21.5 9.5h-4.9L12 22z" fill="#fff" opacity=".25"/><path d="M7.4 9.5h9.2L12 22z" fill="#fff" opacity=".1"/></svg>`;
const CROWN='<svg viewBox="0 0 34 22" width="30" height="20" aria-hidden="true"><path d="M3 19 1.5 6l8 6.5L17 2l7.5 10.5 8-6.5L31 19z" fill="url(#crg)" stroke="#9A5A06" stroke-width="1.2" stroke-linejoin="round"/><rect x="3" y="18" width="28" height="3" rx="1" fill="#C77A0B"/><circle cx="17" cy="12.5" r="2" fill="#fff" opacity=".8"/><defs><linearGradient id="crg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A6"/><stop offset="1" stop-color="#F2A21B"/></linearGradient></defs></svg>';
function card(w,r=0,cls=''){
  return `<span class="card t-${w.t}${r?' r'+r:''} ${cls}" style="${r?`--rc:var(--r${r})`:''}" aria-hidden="true"><span class="ph">${esc(short(w.ti))}</span>${w.img?`<img src="${esc(w.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}${r?`<span class="cmed">${r>1?GEM(r,11):''}</span>`:''}${r===4?`<span class="ccrown">${CROWN}</span>`:''}</span>`;
}

/* ---------- Inspection d'une carte ---------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let insp=null;
const flipFrom=(src,el)=>{const a=src.getBoundingClientRect(),b=el.getBoundingClientRect();return `translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) scale(${a.width/b.width},${a.height/b.height})`};
function inspect(id,src){
  const w=WK[id];if(!w)return;
  const who=collWho||uid,want=collList==='want',r=want?0:rateOf(id,who),ts=(want?dataOf(who).want:dataOf(who).done)[id];
  const ov=$('#insp');
  ov.innerHTML=`<div class="istage"><div class="iwrap"><div class="itilt">${card(w,r)}<span class="glare"></span></div></div>
    <div class="iinfo"><div class="it">${esc(w.ti)}</div><div class="meta">${metaLine(w)}</div>
    ${r?`<div class="irar2">${rarityTag(r)}<span>${esc(RAR[r].s)}</span></div>`:''}
    ${ts?`<div class="meta">${want?'Gardée':'Ajoutée'} le ${new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}</div>`:''}
    <div class="iacts"><button class="btn pri" data-isheet="${esc(id)}">Voir la fiche</button><button class="btn" data-iclose>Fermer</button></div></div></div>`;
  ov.classList.add('open');document.body.style.overflow='hidden';insp={id,src};
  const wrap=ov.querySelector('.iwrap'),tilt=ov.querySelector('.itilt');
  if(src&&!RM){
    wrap.animate([{transform:flipFrom(src,wrap)},{transform:'translateY(-14px) scale(1.05) rotateY(-14deg)',offset:.62},{transform:'none'}],{duration:640,easing:'cubic-bezier(.2,.8,.2,1)'});
    ov.querySelector('.iinfo').animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:380,delay:300,fill:'backwards',easing:'ease-out'});
    ov.animate([{backgroundColor:'rgba(8,10,20,0)'},{backgroundColor:'rgba(8,10,20,.9)'}],{duration:320});
  }
  wrap.onpointermove=e=>{if(RM)return;const b=tilt.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;
    tilt.style.transform=`rotateY(${x*20}deg) rotateX(${-y*20}deg)`;tilt.style.setProperty('--mx',(x+.5)*100+'%');tilt.style.setProperty('--my',(y+.5)*100+'%')};
  wrap.onpointerleave=()=>{tilt.style.transform=''};
  setTimeout(()=>ov.querySelector('[data-isheet]')?.focus({preventScroll:true}),120);
}
function closeInspect(then){
  const ov=$('#insp');if(!ov.classList.contains('open'))return;
  const done=()=>{ov.classList.remove('open');ov.innerHTML='';document.body.style.overflow='';const s=insp?.src;insp=null;if(then)then();else s?.focus?.({preventScroll:true})};
  const src=insp?.src,wrap=ov.querySelector('.iwrap');
  if(src&&src.isConnected&&!RM&&!then){
    ov.querySelector('.iinfo').animate([{opacity:1},{opacity:0}],{duration:140,fill:'forwards'});
    ov.animate([{backgroundColor:'rgba(8,10,20,.9)'},{backgroundColor:'rgba(8,10,20,0)'}],{duration:380,fill:'forwards'});
    wrap.animate([{transform:'none'},{transform:flipFrom(src,wrap)}],{duration:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).onfinish=done;
  }else done();
}
$('#insp').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.isheet){const id=b.dataset.isheet;closeInspect(()=>openSheet(id));return}
  if(b&&'iclose' in b.dataset){closeInspect();return}
  if(!e.target.closest('.iwrap')&&!e.target.closest('.iinfo'))closeInspect();
});

// La carte quitte l'écran de révélation et vient se ranger à sa place dans la collection
function closeReveal(){
  const el=$('#reveal');if(!el.classList.contains('open'))return;
  clearTimeout(revealT);const id=revealId;revealId=null;
  const end=()=>{el.classList.remove('open');el.innerHTML=''};

  if(!target||!flip||RM){end();if(target){target.classList.add('landed');setTimeout(()=>target.classList.remove('landed'),1500)}return}
  target.scrollIntoView({block:'center'});
  const tEl=target.querySelector('.card')||target;tEl.style.visibility='hidden';
  flip.style.animation='none';el.querySelectorAll('.cap,.tap,.burst').forEach(x=>x.style.display='none');
  const a=flip.getBoundingClientRect(),t=tEl.getBoundingClientRect();
  el.querySelector('.rbg').animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'});
  flip.animate([{transform:'none'},{transform:`translate(${t.left+t.width/2-(a.left+a.width/2)}px,${t.top+t.height/2-(a.top+a.height/2)}px) scale(${t.width/a.width},${t.height/a.height})`}],{duration:700,easing:'cubic-bezier(.55,0,.2,1)',fill:'forwards'})
    .onfinish=()=>{tEl.style.visibility='';end();target.classList.add('landed');setTimeout(()=>target.classList.remove('landed'),1500)};
}

  if(d.crar!==undefined){collRar=+d.crar;renderColl();return}
  if('searchall' in d){$('#q').value=$('#collQ').value;F.mine=false;setTab('search');runSearch();return}
  if('explore' in d){$('#q').value='';F.mine=false;F.types.clear();setTab('search');runSearch();return}
  if('more' in d){runSearch(true);return}
  if(b.id==='recBtn'){recOpen=!recOpen;refreshSheet();if(recOpen)$('#recNote')?.focus();return}
  if(d.type!==undefined){if(!d.type){F.types.clear();F.mine=false}else F.types.has(d.type)?F.types.delete(d.type):F.types.add(d.type);F.mine?renderSearch():runSearch();return}
  if('mine' in d){F.mine=!F.mine;F.mine?renderSearch():runSearch();return}
  if(b.id==='reset'||d.act==='reset'){F.types.clear();F.mine=false;F.forWho='';runSearch();return}
  if(b.id==='clear'){$('#q').value='';onQuery();$('#q').focus();return}
  if(b.id==='goSearch'){setTab('search');return}
});
document.addEventListener('click',e=>{const c=e.target.closest('#shelf .case.zoomable');if(c&&!e.target.closest('.sp')&&!e.target.closest('button'))openFs('shelf',c)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('cmi')){e.preventDefault();sendComment(e.target.dataset.rec)}});
document.addEventListener('input',e=>{const tg=e.target;
  if(tg.classList&&tg.classList.contains('cmi'))cmDraft[tg.dataset.rec]=tg.value;
  if(tg.id==='chq'){CH.q=tg.value;chalSearch()}
  if(tg.id==='chNote')CH.note=tg.value;
  if(tg.id==='mTitle'){const v=tg.value.trim()||'Ton œuvre';const a=$('#mpSpine'),b2=$('#mpTitle'),c2=$('#mpCover');if(a)a.title=v;if(b2)b2.textContent=v;if(c2)c2.textContent=v}
  if(tg.id==='mNote'){const n=$('#mpNote');if(n){n.textContent=tg.value.trim()?'« '+tg.value.trim()+' »':'';n.hidden=!tg.value.trim()}}
});
document.addEventListener('input',e=>{if(e.target.id==='recNote'){recNote=e.target.value;const c=$('#recCount');if(c)c.textContent=recNote.length+'/280'}if(e.target.id==='collQ')renderColl()});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#box').classList.contains('open'))closeBox();else if($('#insp').classList.contains('open'))closeInspect();else if($('#sheet').classList.contains('open'))closeSheet();else if($('#fs').classList.contains('open'))closeFs();else if($('#lb').classList.contains('open'))closeGallery();else if($('#reveal').classList.contains('open'))closeReveal();else if($('#sheet').classList.contains('open'))closeSheet();else closeAC()}else if((e.key==='Enter'||e.key===' ')&&$('#reveal').classList.contains('open')){e.preventDefault();closeReveal()}});
const qEl=$('#q');
qEl.addEventListener('input',onQuery);
qEl.addEventListener('focus',renderAC);
qEl.addEventListener('blur',()=>setTimeout(closeAC,150));
qEl.addEventListener('keydown',e=>{
  const open=$('#ac').classList.contains('open');
  if(e.key==='ArrowDown'&&acItems.length){e.preventDefault();if(!open)renderAC();acIdx=(acIdx+1)%acItems.length;markAC()}
  else if(e.key==='ArrowUp'&&acItems.length){e.preventDefault();acIdx=(acIdx-1+acItems.length)%acItems.length;markAC()}
  else if(e.key==='Enter'){e.preventDefault();if(open&&acIdx>=0)pickAC(acIdx);else{remember(qEl.value);closeAC();qEl.blur();clearTimeout(srT);runSearch()}}
});
function markAC(){document.querySelectorAll('#ac .opt').forEach(o=>o.setAttribute('aria-selected',+o.dataset.i===acIdx));const o=$('#ao'+acIdx);if(o){o.scrollIntoView({block:'nearest'});qEl.setAttribute('aria-activedescendant','ao'+acIdx)}}
$('#ac').addEventListener('mousedown',e=>e.preventDefault());

/* ---------- Accès ---------- */
const gate=$('#gate'),gIn=$('#gateIn');
function showGate(html){gIn.innerHTML=`<div class="brand">Sharefs<span aria-hidden="true"></span></div>`+html;gate.classList.add('open');setTimeout(()=>gIn.querySelector('input')?.focus(),60)}
function hideGate(){gate.classList.remove('open')}
let pendingEmail='';
function stepEmail(err='',signup=false){
  showGate(`<h1 id="gateTitle">${signup?'Crée ton compte.':'Partage ce que tu as aimé.'}</h1><p class="sub">${signup?'Un e-mail et un mot de passe d’au moins 8 caractères.':'Connecte-toi avec ton e-mail et ton mot de passe.'}</p>
  <label class="sr" for="gEmail">E-mail</label><input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" value="${esc(pendingEmail)}">
  <label class="sr" for="gPass">Mot de passe</label><input id="gPass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="Mot de passe">
  <p class="err" role="alert">${esc(err)}</p>
  <button class="btn pri" id="${signup?'gSignup':'gLogin'}">${signup?'Créer mon compte':'Me connecter'}</button>
  <p class="or">${signup?'Déjà inscrit ?':'Pas encore de compte ?'}</p><button class="btn" id="${signup?'gToLogin':'gToSignup'}">${signup?'Me connecter':'Créer un compte'}</button>
  ${signup?'':'<button class="link" id="gForgot">Mot de passe oublié ?</button>'}`);
}
function stepForgot(err=''){
  showGate(`<h1 id="gateTitle">Mot de passe oublié.</h1><p class="sub">On t’envoie un code à 6 chiffres par e-mail.</p>
  <label class="sr" for="gEmail">E-mail</label><input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" value="${esc(pendingEmail)}">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gSendCode">Recevoir le code</button><button class="link" id="gToLogin">Retour</button>`);
}
function stepReset(err=''){
  showGate(`<h1 id="gateTitle">Nouveau mot de passe.</h1><p class="sub">Saisis le code reçu à ${esc(pendingEmail)} (pense aux spams).</p>
  <label class="sr" for="gCode">Code</label><input id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Code à 6 chiffres">
  <label class="sr" for="gPass">Nouveau mot de passe</label><input id="gPass" type="password" autocomplete="new-password" placeholder="Nouveau mot de passe">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gReset">Changer le mot de passe</button><button class="link" id="gToLogin">Retour</button>`);
}
function stepName(err=''){
  showGate(`<h1 id="gateTitle">Comment tes amis t’appellent ?</h1><p class="sub">Ce prénom s’affiche à côté de tes recommandations.</p>
  <label class="sr" for="gName">Prénom</label><input id="gName" maxlength="40" autocomplete="given-name" placeholder="Prénom" value="${esc(myName)}">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gSaveName">Continuer</button>`);
}
function stepCircle(err=''){
  showGate(`<h1 id="gateTitle">Rejoins tes amis.</h1><p class="sub">Un cercle regroupe les amis qui voient tes conseils et ta collection.</p>
  <label class="sr" for="gJoin">Code d’invitation</label><input id="gJoin" maxlength="6" autocapitalize="characters" placeholder="Code reçu d’un ami">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gJoinBtn">Rejoindre le cercle</button>
  <p class="or">ou</p><button class="btn" id="gCreate">Créer un cercle</button>${uid&&myCircles.length?'<button class="link" id="gCancel">Annuler</button>':''}`);
}
async function busy(btn,fn){btn.disabled=true;try{await fn()}finally{if(btn.isConnected)btn.disabled=false}}
function loggedIn(res){token=res.token;lsSet('sharefs-token',token);return afterLogin(res.user)}
gate.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const em=()=>{pendingEmail=($('#gEmail')?.value||pendingEmail).trim()};
  if(b.id==='gToSignup'){em();stepEmail('',true)}
  if(b.id==='gToLogin'){em();stepEmail()}
  if(b.id==='gForgot'){em();stepForgot()}
  if(b.id==='gCancel')hideGate();
  if(b.id==='gLogin'||b.id==='gSignup')busy(b,async()=>{
    const signup=b.id==='gSignup';em();const password=$('#gPass').value;
    try{await loggedIn(await call('POST',signup?'auth/signup':'auth/login',{email:pendingEmail,password}))}catch(err){stepEmail(msg(err),signup)}});
  if(b.id==='gSendCode')busy(b,async()=>{em();try{await call('POST','auth/forgot',{email:pendingEmail});stepReset()}catch(err){stepForgot(msg(err))}});
  if(b.id==='gReset')busy(b,async()=>{try{await loggedIn(await call('POST','auth/reset',{email:pendingEmail,code:$('#gCode').value.trim(),password:$('#gPass').value}))}catch(err){stepReset(msg(err))}});
  if(b.id==='gSaveName')busy(b,async()=>{const n=$('#gName').value.trim();if(!n)return stepName('Indique un prénom.');
    try{await call('PUT','me',{name:n});myName=n;await ensureCircle()}catch(err){stepName(msg(err))}});
  if(b.id==='gJoinBtn')busy(b,async()=>{try{await call('POST','circles/join',{code:$('#gJoin').value.trim()});await enterApp()}catch(err){stepCircle(msg(err))}});
  if(b.id==='gCreate')busy(b,async()=>{try{await call('POST','circles');await enterApp()}catch(err){stepCircle(msg(err))}});
});
gate.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();gate.querySelector('.btn.pri')?.click()}});

async function afterLogin(user){
  uid=user.id;myName=user.name||'';mine=normData(user.data);Object.values(mine.works).forEach(reg);
  if(!myName)return stepName();
  await ensureCircle();
}
async function ensureCircle(){
  const st=await call('GET','state');
  if(!st.circles.length)return stepCircle();
  applyState(st);await enterApp(true);
}
function applyState(st){
  members={};names={};
  st.members.forEach(m=>{const d=normData(m.data);members[m.id]={name:m.name,data:d};names[m.id]=m.name;Object.values(d.works).forEach(reg)});
  if(members[uid]&&!saving&&!dirty){mine=members[uid].data;myName=members[uid].name}
  myCircles=st.circles;recs=st.recs||[];recs.forEach(x=>reg(x.work));
  comments=st.comments||[];challenges=st.challenges||[];challenges.forEach(c=>(c.works||[]).forEach(reg));checkWins(lsGet('sharefs-wins',null)===null);
  renderAll();
}
async function loadAll(){try{applyState(await call('GET','state'))}catch(e){if(e.code!=='unauthorized')toast(msg(e))}}
let poll=null;
async function enterApp(loaded=false){
  hideGate();if(!loaded)await loadAll();
  clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==='visible'&&uid)loadAll()},25000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&uid)loadAll()});

/* ---------- Compte ---------- */
function renderAccount(){
  const el=$('#account');if(!el)return;
  if(!uid||collWho!==uid){el.innerHTML='';return}
  el.innerHTML=`<h2>Mon compte</h2><div class="account">
    <div class="line"><span>Prénom</span><b>${esc(myName)}</b></div>
    ${myCircles.map(c=>`<div class="line"><span>Code d’invitation<br><span class="code">${esc(c)}</span></span><button class="btn" data-invite="${esc(c)}">Inviter</button></div>`).join('')}
    <div class="stack">
      <button class="btn" data-acc="name">Changer de prénom</button>
      <button class="btn" data-acc="join">Rejoindre un autre cercle</button>
      <button class="btn" data-acc="logout">Me déconnecter</button>
      <button class="btn danger" data-acc="delete">Supprimer mon compte</button>
    </div></div><p class="credits">Données des œuvres : TMDB, Google Books et IGDB. Ce produit utilise l’API TMDB sans être approuvé ni certifié par TMDB.</p>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-invite],button[data-acc]');if(!b)return;
  if(b.dataset.invite){const code=b.dataset.invite,link=CFG.apiBase||location.origin,text=`Rejoins-moi sur Sharefs avec le code ${code} : ${link}`;
    try{if(navigator.share)await navigator.share({title:'Sharefs',text});else{await navigator.clipboard.writeText(text);toast('Invitation copiée')}}catch(err){}return}
  const a=b.dataset.acc;
  if(a==='name')stepName();
  if(a==='join')stepCircle();
  if(a==='logout'){try{await call('POST','auth/logout')}catch(err){}token='';lsSet('sharefs-token','');location.reload()}
  if(a==='delete'&&confirm('Supprimer ton compte, ta collection et tes recommandations ? Cette action est définitive.')){
    try{await call('DELETE','me');token='';lsSet('sharefs-token','');location.reload()}catch(err){toast(msg(err))}}
});

let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(collView==='shelf'&&$('#v-coll').classList.contains('on'))renderColl()},200)});

/* ---------- Démarrage ---------- */
renderAll();
(async()=>{
  if(!token)return stepEmail();
  try{await afterLogin(await call('GET','me'))}catch(e){if(e.code!=='unauthorized')stepEmail(msg(e))}
})();

</script>
