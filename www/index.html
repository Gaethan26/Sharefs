<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22150C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sharefs">
<title>Sharefs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,0..100,0..1&family=Libre+Franklin:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --wood-1:#2F1E12;--wood-2:#22150C;--wood-3:#3D2717;
  --parch:#F2E4C3;--parch-2:#E4CF9F;--parch-3:#D2B57B;
  --ink:#2B1B10;--muted:#6E5A43;--cream:#F6EAD0;--cream-muted:#CDB48C;
  --gold:#EBBE5A;--gold-l:#FFE7A3;--gold-d:#9A661B;--edge:#1A0F07;
  --film:#E9A80D;--serie:#2F74E0;--livre:#1E9A64;--jeu:#D23F7C;
  --r1:#ADA592;--r2:#3E8CF0;--r3:#A84EE6;--r4:#FF9B21;
  --ok:#3FA45A;--danger:#B3362F;
  --film-ink:#2B1B10;--hl:#FFD978;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Libre Franklin",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--wood-2)}
body{margin:0;min-height:100%;color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(255,190,90,.16),transparent 60%),
    repeating-linear-gradient(92deg,rgba(0,0,0,.08) 0 3px,transparent 3px 11px,rgba(255,255,255,.025) 11px 13px,transparent 13px 29px),
    linear-gradient(var(--wood-1),var(--wood-2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--wood-2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold-l);outline-offset:2px}
.app{max-width:620px;margin:0 auto;padding:0 16px 120px}

/* titres */
h1,h2,.brand{font-family:var(--serif);font-variation-settings:"SOFT" 100,"WONK" 0;letter-spacing:-.01em}
h1{font-size:36px;line-height:1.02;font-weight:900;margin:12px 0 6px;color:var(--gold-l);text-shadow:0 2px 0 var(--edge),0 0 18px rgba(255,190,90,.25)}
h2{font-size:22px;font-weight:800;margin:30px 0 12px;color:var(--gold);text-shadow:0 2px 0 var(--edge);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold-d),transparent)}
.sub{color:var(--cream-muted);margin:0 0 18px}

/* en-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;
  background:linear-gradient(var(--wood-2) 70%,transparent)}
.brand{font-size:32px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 2px 0 var(--edge),0 -1px 0 var(--gold-l)}
.brand span{display:inline-block;width:11px;height:11px;margin-left:5px;vertical-align:5px;transform:rotate(45deg);background:var(--jeu);box-shadow:15px -15px 0 var(--film),30px -30px 0 var(--serie),45px -45px 0 var(--livre);
  border:1.5px solid var(--gold-l);box-shadow:none}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);
  background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold) 45%,var(--gold-d));border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge),inset 0 1px 0 rgba(255,255,255,.6)}
.iconbtn svg{width:20px;height:20px}
.view{display:none}.view.on{display:block}

/* barre d'onglets : planche de bois */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px);
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 17px),linear-gradient(#563620,#3A2414);
  border-top:3px solid var(--gold-d);box-shadow:0 -1px 0 var(--gold-l) inset,0 -8px 18px rgba(0,0,0,.45)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--cream-muted);font-weight:700;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--gold-l);text-shadow:0 0 10px rgba(255,200,100,.6)}
nav.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-8px;width:12px;height:12px;transform:rotate(45deg);background:var(--gold);border:2px solid var(--edge)}

/* parchemin générique */
.parch,.ev,.panel,.res,.empty,.level,.stat,.account,.ac,.sheet,.grimoire{
  color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#F8EDD2,transparent 70%),linear-gradient(var(--parch),var(--parch-2));
  border:2px solid var(--gold-d);box-shadow:0 0 0 2px var(--edge),inset 0 0 0 3px rgba(255,240,200,.55),inset 0 0 26px rgba(120,80,30,.28),0 6px 0 rgba(0,0,0,.35)}

/* gemmes de type */
.tm{display:inline-block;width:12px;height:12px;transform:rotate(45deg);flex:none;border:1.5px solid var(--edge);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.t-f.tm{background:var(--film)}.t-s.tm{background:var(--serie)}.t-l.tm{background:var(--livre)}.t-j.tm{background:var(--jeu)}

/* gemme de rareté */
.rg{display:inline-block;width:12px;height:14px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:var(--rc,var(--r1));vertical-align:-2px;
  filter:drop-shadow(0 0 .7px #2B1B10) drop-shadow(0 0 .7px #2B1B10)}
.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.rname{font-weight:800;color:var(--rcd,var(--muted))}
.r2 .rname,.rname.r2{color:#1D5FC0}.r3 .rname,.rname.r3{color:#7A2DB3}.r4 .rname,.rname.r4{color:#B8610A}

/* fil */
.ev{border-radius:14px;padding:16px;margin-bottom:16px}
.ev .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.ev .who b{color:var(--ink);font-weight:800}
.ev .who>span:not(.av){flex:1}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:15px;flex:none;color:var(--ink);
  background:radial-gradient(circle at 35% 30%,var(--gold-l),var(--gold) 50%,var(--gold-d));border:2px solid var(--edge)}
.ev .work{display:flex;gap:14px;align-items:stretch;margin-top:12px;border:0;background:none;padding:0;text-align:left;width:100%;color:inherit}
.ev .ti{font-family:var(--serif);font-size:21px;font-weight:800;line-height:1.1}
.meta{font-size:14px;color:var(--muted)}
.note{margin:14px 0 0;font-family:var(--serif);font-style:italic;font-size:17px;padding:10px 14px;background:rgba(255,255,255,.35);border-radius:8px;border-left:4px solid var(--gold-d)}
.ev .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ev .del{border:0;background:none;color:var(--muted);font-size:14px;padding:4px;text-decoration:underline}

/* vignettes (jaquettes) */
.cover{width:58px;min-height:84px;flex:none;position:relative;display:flex;align-items:flex-end;padding:6px;color:#fff;font-weight:800;font-size:11px;line-height:1.05;overflow:hidden;
  border-radius:6px;border:2px solid var(--gold-d);box-shadow:0 0 0 1.5px var(--edge),0 3px 0 rgba(0,0,0,.3)}
.cover.t-f{background:var(--film);color:var(--film-ink)}.cover.t-s{background:var(--serie)}.cover.t-l{background:var(--livre)}.cover.t-j{background:var(--jeu)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ct{position:relative}
.cover.has-img .ct{visibility:hidden}
.ev .cover{height:88px}

/* boutons */
.btn{border:2px solid var(--edge);border-radius:999px;padding:9px 18px;font-weight:800;font-size:15px;color:var(--ink);
  background:linear-gradient(#FBF0D6,#E3CB97);box-shadow:0 3px 0 var(--edge),inset 0 1px 0 #fff}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.btn.pri{background:linear-gradient(#FFE89E,#F0B93D 55%,#C98A1E);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.on{background:linear-gradient(#7FD48E,#3FA45A 60%,#2B7A3F);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.danger{background:none;border-color:transparent;box-shadow:none;color:var(--danger);text-decoration:underline}
.btn:disabled{opacity:.55;cursor:default}
.empty{text-align:center;padding:30px 20px;border-radius:14px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-size:21px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.empty .cardback{width:84px;margin:0 auto 14px}

/* recherche */
.sbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:15;padding-bottom:10px;background:linear-gradient(var(--wood-2) 80%,transparent)}
.field{position:relative}
.field input{width:100%;height:64px;border:3px solid var(--gold-d);background:linear-gradient(#FBF2DC,#EAD7AB);color:var(--ink);border-radius:16px;padding:0 52px;font-size:21px;font-weight:700;font-family:var(--serif);
  box-shadow:0 0 0 2px var(--edge),inset 0 3px 10px rgba(100,60,20,.25)}
.field input::placeholder{color:#8E7656;font-weight:500}
.field input:focus{outline:none;box-shadow:0 0 0 2px var(--edge),0 0 0 6px rgba(255,200,90,.45),inset 0 3px 10px rgba(100,60,20,.25)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.field .lens{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;pointer-events:none;color:var(--gold-d)}
.field .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:2px solid var(--edge);background:var(--parch-3);width:32px;height:32px;border-radius:50%;display:none;color:var(--ink)}
.field.has .clear{display:grid;place-items:center}
.ac{position:absolute;left:0;right:0;top:72px;border-radius:14px;max-height:min(60vh,460px);overflow:auto;display:none;padding:6px 0}
.ac.open{display:block}
.ac .grp{font-family:var(--serif);font-size:14px;color:var(--gold-d);padding:10px 16px 4px;font-weight:800}
.ac .opt{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.ac .opt[aria-selected="true"]{background:rgba(154,102,27,.18)}
.ac .opt .ot{font-weight:700}
.ac .opt .om{font-size:13px;color:var(--muted)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.row{display:flex;gap:8px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.row::-webkit-scrollbar{display:none}
.chip{border:2px solid var(--edge);background:linear-gradient(#F6EACB,#DCC38E);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;box-shadow:0 2px 0 var(--edge)}
.chip[aria-pressed="true"]{background:linear-gradient(#FFE89E,#F0B93D 60%,#C98A1E);box-shadow:0 2px 0 var(--edge),0 0 12px rgba(255,190,80,.55)}
.chip .av{width:22px;height:22px;font-size:11px;border-width:1.5px}
.chip.ftr{margin-left:auto}
.chip .cnt{background:var(--danger);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;border:1.5px solid var(--edge)}
.panel{border-radius:14px;padding:6px 16px 16px;margin-top:10px;display:none}
.panel.open{display:block}
.panel h3{font-family:var(--serif);font-size:16px;margin:14px 0 8px;font-weight:800;color:var(--gold-d)}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.wrap .chip{font-size:14px;padding:5px 12px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{border:2px solid var(--edge);background:var(--parch-2);color:var(--ink);border-radius:999px;padding:3px 10px 3px 12px;font-size:14px;font-weight:600}
.pill::after{content:"×";margin-left:6px;color:var(--muted)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;font-size:14px;color:var(--cream-muted)}
select{border:2px solid var(--edge);background:var(--parch);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:15px;font-weight:600}
.res{list-style:none;margin:0;padding:0;border-radius:14px;overflow:hidden}
.res li+li{border-top:1px solid rgba(43,27,16,.18)}
.res button{display:flex;gap:12px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;align-items:center;color:inherit}
.res .cover{width:40px;min-height:58px;height:58px;font-size:0}
.res .ti{font-family:var(--serif);font-weight:800;font-size:18px;line-height:1.15}
.badges{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--parch-3);border:1.5px solid var(--edge);display:inline-flex;align-items:center;gap:5px}
.bdg.done{background:var(--ok);color:#fff}
.bdg.rec{background:var(--jeu);color:#fff}
.more{display:block;margin:18px auto 0}
.loading{color:var(--cream-muted);text-align:center;padding:22px 0;font-family:var(--serif);font-style:italic}

/* collection */
.who-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.who-row::-webkit-scrollbar{display:none}
.rank{display:flex;gap:14px;align-items:center;border-radius:14px;padding:14px;margin:12px 0}
.medal{width:64px;height:64px;flex:none;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:24px;color:var(--ink);
  clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:radial-gradient(circle at 40% 30%,var(--gold-l),var(--gold) 50%,var(--gold-d));position:relative}
.rank .rt{font-family:var(--serif);font-size:20px;font-weight:900;line-height:1.1}
.bar{height:10px;background:rgba(43,27,16,.2);border-radius:99px;overflow:hidden;margin-top:8px;border:1.5px solid var(--edge)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold),var(--gold-l));transition:width .6s}
.rarities{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rar{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.rar b{font-family:var(--serif);font-size:20px;color:var(--ink)}
.rar .rg{width:16px;height:19px}
.grimoire{border-radius:16px;padding:12px 12px 16px;position:relative}
.bookmarks{display:flex;gap:4px;margin:-12px -4px 12px;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.bookmarks::-webkit-scrollbar{display:none}
.bm{border:2px solid var(--edge);border-top:0;border-radius:0 0 10px 10px;padding:12px 12px 8px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap;
  background:linear-gradient(#5A3A20,#3A2414);box-shadow:0 3px 0 var(--edge);display:inline-flex;align-items:center;gap:6px;text-shadow:0 1px 0 #000}
.bm[aria-pressed="true"]{padding-top:18px;background:linear-gradient(#B07B2A,#7A4E14)}
.bm .n{opacity:.8;font-weight:600}
.gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.mini{flex:1 1 170px;min-width:0;height:44px;border:2px solid var(--gold-d);background:#FBF3DE;color:var(--ink);border-radius:10px;padding:0 12px;font-size:16px;box-shadow:inset 0 2px 6px rgba(100,60,20,.2)}
.mini:focus{outline:none;border-color:var(--edge)}
.seg{display:inline-flex;border:2px solid var(--edge);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--parch-2);padding:9px 10px;font-weight:800;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:linear-gradient(#FFE89E,#F0B93D)}
.gfilter{display:flex;justify-content:center;gap:10px;margin-top:16px;padding-top:12px;border-top:2px dashed rgba(154,102,27,.5)}
.gfilter button{border:0;background:none;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted)}
.gfilter .rg{width:26px;height:31px;transition:transform .15s}
.gfilter button[aria-pressed="true"] .rg{transform:scale(1.25);filter:drop-shadow(0 0 6px var(--rc))}
.gfilter button[aria-pressed="true"]{color:var(--ink)}
.gfilter .all{width:26px;height:31px;display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:480px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* carte */
.card{position:relative;display:block;width:100%;aspect-ratio:5/7;border:0;padding:0;background:none;container-type:inline-size;color:var(--ink);text-align:center;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.card .frame{position:absolute;inset:0;border-radius:9cqw 9cqw 7cqw 7cqw;
  background:radial-gradient(90% 60% at 50% 25%,rgba(255,255,255,.25),transparent 70%),linear-gradient(165deg,color-mix(in srgb,var(--tc) 55%,#fff) 0%,var(--tc) 40%,color-mix(in srgb,var(--tc) 55%,#000) 100%);
  border:1.6cqw solid var(--edge);box-shadow:inset 0 0 0 1.4cqw var(--gold),inset 0 0 0 2.4cqw rgba(0,0,0,.3)}
.card.t-f{--tc:var(--film)}.card.t-s{--tc:var(--serie)}.card.t-l{--tc:var(--livre)}.card.t-j{--tc:var(--jeu)}
.card .art{position:absolute;left:12%;right:12%;top:7%;height:51%;overflow:hidden;background:#1B120B;
  border-radius:50% 50% 14% 14%/40% 40% 10% 10%;border:1.6cqw solid var(--gold);box-shadow:0 0 0 1.2cqw var(--edge),inset 0 0 6cqw rgba(0,0,0,.6)}
.card .art img{width:100%;height:100%;object-fit:cover;display:block}
.card .art .noimg{position:absolute;inset:0;display:grid;place-items:center;padding:12%;font-family:var(--serif);font-weight:900;font-size:10cqw;color:var(--gold-l);line-height:1}
.card .tg{position:absolute;left:-3%;top:-2%;width:23%;aspect-ratio:1;display:grid;place-items:center;transform:rotate(45deg);border:1.4cqw solid var(--edge);
  background:radial-gradient(circle at 35% 30%,#fff8,transparent 45%),var(--tc);box-shadow:0 0 0 1cqw var(--gold) inset}
.card .tg svg{width:56%;height:56%;transform:rotate(-45deg);color:#fff;filter:drop-shadow(0 1px 0 #0008)}
.card .banner{position:absolute;left:4%;right:4%;top:54%;height:12.5%;display:grid;place-items:center;padding:0 11%;
  background:linear-gradient(#6C4626,#3E2513);color:#FFF4D6;font-family:var(--serif);font-weight:900;font-size:8.2cqw;line-height:1;
  clip-path:polygon(0 20%,7% 0,93% 0,100% 20%,95% 50%,100% 80%,93% 100%,7% 100%,0 80%,5% 50%);text-shadow:0 .4cqw 0 #000,0 0 1.5cqw #000}
.card .banner span{display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .rgem{position:absolute;left:50%;top:66.5%;width:10cqw;height:12cqw;transform:translateX(-50%);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);
  background:radial-gradient(circle at 40% 30%,#fff9,transparent 50%),var(--rc,var(--r1));filter:drop-shadow(0 0 1cqw #000)}
.card .desc{position:absolute;left:11%;right:11%;top:76%;bottom:7%;display:grid;place-items:center;padding:0 4%;font-size:6.6cqw;line-height:1.15;font-weight:600;
  background:linear-gradient(#F8EDD2,#E6D2A4);border-radius:3cqw;border:.8cqw solid rgba(43,27,16,.45);overflow:hidden}
.card.r4::before{content:"";position:absolute;z-index:2;left:50%;top:-6%;width:52%;height:15%;transform:translateX(-50%);
  background:radial-gradient(circle at 50% 70%,var(--gold-l),var(--gold) 45%,var(--gold-d));
  clip-path:polygon(50% 0,58% 35%,78% 10%,74% 45%,100% 30%,86% 70%,60% 100%,40% 100%,14% 70%,0 30%,26% 45%,22% 10%,42% 35%);filter:drop-shadow(0 1cqw 0 var(--edge))}
.card.r4 .frame{animation:legend 3.2s ease-in-out infinite}
.card.r3 .frame{box-shadow:inset 0 0 0 1.4cqw var(--gold),inset 0 0 0 2.4cqw rgba(0,0,0,.3),0 0 5cqw rgba(168,78,230,.55)}
@keyframes legend{0%,100%{box-shadow:inset 0 0 0 1.4cqw var(--gold),inset 0 0 0 2.4cqw rgba(0,0,0,.3),0 0 4cqw rgba(255,155,33,.5)}50%{box-shadow:inset 0 0 0 1.4cqw var(--gold-l),inset 0 0 0 2.4cqw rgba(0,0,0,.3),0 0 9cqw rgba(255,155,33,.95)}}
.card.ghost{filter:grayscale(1) brightness(.8) drop-shadow(0 6px 5px rgba(0,0,0,.45))}
.card.new{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}

/* dos de carte */
.cardback{position:relative;aspect-ratio:5/7;border-radius:10px;border:3px solid var(--edge);
  background:radial-gradient(circle at 50% 50%,transparent 22%,var(--gold) 23% 25%,transparent 26% 33%,var(--gold-d) 34% 35%,transparent 36%),
    repeating-conic-gradient(from 0deg,#3B2A6B 0 15deg,#2A1D52 15deg 30deg);box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 0 7px var(--edge),0 6px 0 rgba(0,0,0,.35)}
.cardback::after{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold-l);font-size:28px;text-shadow:0 0 10px var(--gold)}

/* étagère */
.shelf{border-radius:14px;padding:18px 14px 0;background:linear-gradient(#3A2414,#2A190D);border:2px solid var(--gold-d);box-shadow:0 0 0 2px var(--edge),inset 0 0 30px rgba(0,0,0,.5)}
.plank{display:flex;align-items:flex-end;gap:3px;width:100%;flex-wrap:wrap;border-bottom:12px solid #6B4426;box-shadow:0 6px 0 #2A190D;margin-bottom:22px;min-height:130px}
.spine{border:2px solid var(--edge);width:30px;border-radius:3px 3px 1px 1px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:800;padding:8px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;text-align:left;line-height:26px;position:relative;
  box-shadow:inset 0 0 0 2px rgba(255,220,140,.5)}
.spine.t-f{background:var(--film);color:var(--film-ink)}.spine.t-s{background:var(--serie)}.spine.t-l{background:var(--livre)}.spine.t-j{background:var(--jeu)}
.spine::after{content:"";position:absolute;left:50%;top:6px;width:10px;height:12px;transform:translateX(-50%);clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:var(--rc,var(--r1))}
.slot{width:30px;height:70px;border:2px dashed var(--gold-d);border-radius:3px}

/* fiche */
.scrim{position:fixed;inset:0;background:rgba(10,5,2,.65);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .28s ease;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .in{max-width:620px;margin:0 auto}
.grab{width:46px;height:6px;border-radius:9px;background:var(--gold-d);margin:0 auto 14px}
.sh-top{display:flex;gap:16px;align-items:flex-start}
.sh-top .card{width:128px;flex:none}
.sh-top h3{font-family:var(--serif);font-size:26px;line-height:1.05;margin:2px 0 6px;font-weight:900}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:16px 0}
.facts dt{color:var(--muted);font-weight:600}.facts dd{margin:0}
.syn{font-size:15px;line-height:1.55;margin:0 0 16px}
.sh-acts{display:flex;gap:8px;flex-wrap:wrap}
.sh-acts .btn{flex:1 1 auto;padding:12px 16px}
.pick{margin:16px 0 4px;padding:14px;border-radius:12px;background:rgba(255,255,255,.4);border:2px solid var(--gold-d)}
.pick p{margin:0 0 10px;font-family:var(--serif);font-weight:800;font-size:17px}
.pick .opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick button{border:2px solid var(--edge);border-radius:10px;background:var(--parch);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;min-width:0;letter-spacing:-.01em;font-weight:800;color:var(--ink);box-shadow:0 2px 0 var(--edge)}
.pick button .rg{width:24px;height:29px}
.pick button[aria-pressed="true"]{background:linear-gradient(#FFE89E,#F0B93D);box-shadow:0 2px 0 var(--edge),0 0 14px var(--rc)}
.pick small{font-weight:600;color:var(--muted);font-size:11px}
textarea{width:100%;border:2px solid var(--gold-d);background:#FBF3DE;color:var(--ink);border-radius:10px;padding:10px 12px;font-size:16px;min-height:84px;resize:vertical;margin:12px 0 8px}
.to{margin:12px 0 2px;font-size:14px;color:var(--muted);font-weight:700}
.to .wrap{margin-top:6px}
.social{margin-top:18px;font-size:15px}
.social .line{display:flex;align-items:center;gap:8px;margin:7px 0}

/* révélation de carte */
.reveal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(50,28,10,.9),rgba(5,3,1,.97));cursor:pointer}
.reveal.open{display:grid}
.reveal .stage{width:min(62vw,250px);perspective:1200px;text-align:center}
.reveal .flip{position:relative;aspect-ratio:5/7;transform-style:preserve-3d;animation:flip 1s .25s cubic-bezier(.3,1.3,.5,1) both}
.reveal .flip>*{position:absolute;inset:0;backface-visibility:hidden}
.reveal .flip .cardback{transform:rotateY(180deg)}
.reveal .burst{position:absolute;left:50%;top:45%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 var(--rc);animation:burst 1.1s .9s ease-out both;pointer-events:none}
.reveal .cap{margin-top:22px;font-family:var(--serif);font-weight:900;font-size:24px;color:var(--gold-l);text-shadow:0 2px 0 #000;animation:fadeup .5s 1.1s both}
.reveal .cap .rname{display:block;font-size:30px;color:var(--rc);text-shadow:0 0 18px var(--rc),0 2px 0 #000}
.reveal .tap{margin-top:8px;color:var(--cream-muted);font-size:14px;animation:fadeup .5s 1.5s both}
@keyframes flip{from{transform:rotateY(180deg) scale(.6)}to{transform:rotateY(0) scale(1)}}
@keyframes burst{0%{box-shadow:0 0 0 0 var(--rc);opacity:1}100%{box-shadow:0 0 0 70vmax transparent;opacity:0}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}

/* compte, toast, accès */
.account{border-radius:14px;padding:6px 16px 16px;margin-top:10px}
.account .line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(43,27,16,.18)}
.account .code{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:.1em}
.account .stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.credits{margin-top:14px;font-size:13px;color:var(--cream-muted)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center;
  padding:11px 34px;font-family:var(--serif);font-weight:800;font-size:16px;color:#FFF1CF;text-shadow:0 1px 0 #000;
  background:linear-gradient(#A7342A,#7A1E18);clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);filter:drop-shadow(0 3px 0 #000)}
.toast.on{opacity:1}
.gate{position:fixed;inset:0;z-index:80;display:none;overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 22px calc(30px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 60% at 50% 0%,rgba(255,190,90,.2),transparent 60%),linear-gradient(var(--wood-1),var(--wood-2))}
.gate.open{display:block}
.gate .in{max-width:420px;margin:0 auto}
.gate .brand{font-size:48px;margin-bottom:22px}
.gate .deck{display:flex;gap:10px;margin:0 0 22px}
.gate .deck .cardback{width:64px}
.gate .deck .cardback:nth-child(2){transform:translateY(-8px) rotate(3deg)}
.gate .deck .cardback:nth-child(3){transform:rotate(-4deg)}
.gate input{width:100%;height:56px;border:3px solid var(--gold-d);background:linear-gradient(#FBF2DC,#EAD7AB);color:var(--ink);border-radius:12px;padding:0 16px;font-size:18px;margin:6px 0 10px;box-shadow:0 0 0 2px var(--edge)}
.gate .btn{width:100%;padding:14px;font-size:17px;margin-top:6px}
.gate .err{color:#FF9C8C;font-weight:700;min-height:1.4em;margin:6px 0}
.gate .or{text-align:center;color:var(--cream-muted);margin:18px 0 8px}
.gate .link{background:none;border:0;color:var(--gold);text-decoration:underline;font-weight:700;display:block;margin:14px auto 0;padding:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>

        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Titre, auteur, studio…" role="combobox" aria-expanded="false" aria-controls="ac" aria-autocomplete="list" aria-label="Rechercher une œuvre">
        <button class="clear" id="clear" aria-label="Effacer la recherche"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

<script src="config.js"></script>
<script>
/* ---------- Base ---------- */
const CFG=window.SHAREFS_CONFIG||{};
const API=(CFG.apiBase||'').replace(/\/$/,'')+'/api';
const T={
  f:{n:'Film',p:'Films',done:'Vu',act:'J’ai vu',did:'a vu',fmt:m=>`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`},
  s:{n:'Série',p:'Séries',done:'Terminée',act:'J’ai terminé',did:'a terminé',fmt:x=>x+(x>1?' saisons':' saison')},
  l:{n:'Livre',p:'Livres',done:'Lu',act:'J’ai lu',did:'a lu',fmt:x=>x+' pages'},
  j:{n:'Jeu',p:'Jeux',done:'Fini',act:'J’ai fini',did:'a fini',fmt:()=>''}
};
const RAR=[null,{n:'Commune',s:'Sympa'},{n:'Rare',s:'Très bien'},{n:'Épique',s:'Génial'},{n:'Légendaire',s:'Chef-d’œuvre'}];
const RANKS=[[0,'Recrue'],[1,'Apprenti'],[10,'Aventurier'],[25,'Héros'],[50,'Champion'],[100,'Légende']];
const ICON={
  f:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10h18v10H3z"/><path d="M2.6 5.3 19.8 2.6l.6 3.9L3.2 9.2z"/></svg>',
  s:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8 2.5 12 6.5l4-4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>',
  l:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.5 5c3.2-1.2 6.3-1 9 .7V21c-2.7-1.6-5.8-1.8-9-.7zM21.5 5c-3.2-1.2-6.3-1-9 .7V21c2.7-1.6 5.8-1.8 9-.7z"/></svg>',
  j:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 015 5v.5a4 4 0 01-7.2 2.4L13.6 13h-3.2l-1.2 1.9A4 4 0 012 12.5V12a5 5 0 015-5z"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’'`]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const REG=(()=>{try{return new Intl.DisplayNames(['fr'],{type:'region'})}catch(e){return null}})();
const country=c=>{if(!c)return'';try{return REG?REG.of(c):c}catch(e){return c}};

/* ---------- Serveur ---------- */
let token=lsGet('sharefs-token','');
async function call(method,path,body){
  let r;
  try{r=await fetch(API+'/'+path,{method,headers:{'Content-Type':'application/json',...(token?{'X-Sharefs-Token':token}:{})},body:body?JSON.stringify(body):undefined})}
  catch(e){throw Object.assign(new Error('offline'),{code:'offline'})}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&!path.startsWith('auth/')){token='';lsSet('sharefs-token','');stepEmail('Ta session a expiré, reconnecte-toi.')}
  if(!r.ok)throw Object.assign(new Error(j.error||'http_'+r.status),{code:j.error||'http_'+r.status,status:r.status});
  return j;
}
function api(path,params){const qs=new URLSearchParams(Object.entries(params||{}).filter(([,v])=>v!==''&&v!=null)).toString();return call('GET',path+(qs?'?'+qs:''))}
const ERR={bad_email:'Cette adresse e-mail n’est pas valide.',weak_password:'Le mot de passe doit faire au moins 8 caractères.',email_taken:'Un compte existe déjà avec cet e-mail.',
  bad_credentials:'E-mail ou mot de passe incorrect.',too_many_attempts:'Trop d’essais. Réessaie dans un quart d’heure.',bad_code:'Code incorrect ou expiré.',
  unknown_code:'Aucun cercle ne correspond à ce code.',bad_recipients:'Un destinataire ne fait pas partie de tes cercles.',offline:'Pas de connexion au serveur.',server_error:'Erreur du serveur. Réessaie.'};
const msg=e=>ERR[e?.code]||('Erreur : '+(e?.code||e?.message||'inconnue'));

/* ---------- État ---------- */
let uid=null,myName='',myCircles=[];
let members={};
let mine={done:{},want:{},works:{},rate:{}};
let recs=[];
let names={};
const WK={};
function normData(d){d=d&&typeof d==='object'&&!Array.isArray(d)?{...d}:{};for(const k of ['done','want','works','rate'])if(!d[k]||Array.isArray(d[k]))d[k]={};delete d.shares;return d}
function reg(w){
  if(!w||!w.id)return w;
  const o=WK[w.id];if(!o){WK[w.id]={...w};return WK[w.id]}
  for(const [k,v] of Object.entries(w))if(v!==''&&v!=null&&!(Array.isArray(v)&&!v.length))o[k]=v;
  return o;
}
const snap=w=>Object.fromEntries(Object.entries({id:w.id,t:w.t,ti:w.ti,y:w.y,c:w.c,img:w.img,g:(w.g||[]).slice(0,3),d:w.d,p:w.p}).filter(([,v])=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)));

let saving=false,dirty=false;
async function save(){
  if(!uid)return;dirty=true;if(saving)return;saving=true;
  while(dirty){dirty=false;try{await call('PUT','me',{data:mine})}catch(e){toast(msg(e));break}}
  saving=false;
}
const others=()=>Object.keys(members).filter(k=>k!==uid);
const nameOf=id=>id===uid?(myName||'Toi'):(names[id]||'Un ami');
function avatar(id){const n=nameOf(id);return `<span class="av" aria-hidden="true">${esc((n[0]||'?').toUpperCase())}</span>`}
const dataOf=id=>id===uid?mine:(members[id]?.data||normData());

/* ---------- Œuvres et cartes ---------- */
const short=t=>String(t||'').length>24?String(t).slice(0,22)+'…':String(t||'');
const cover=w=>`<span class="cover t-${w.t}${w.img?' has-img':''}" aria-hidden="true">${w.img?`<img src="${esc(w.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:''}<span class="ct">${esc(short(w.ti))}</span></span>`;
function card(w,r=0,cls=''){
  return `<span class="card t-${w.t}${r?' r'+r:''} ${cls}" style="${r?`--rc:var(--r${r})`:''}" aria-hidden="true"><span class="frame"></span>
    <span class="art"><span class="noimg">${esc(short(w.ti))}</span>${w.img?`<img src="${esc(w.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" style="position:relative;z-index:1" onerror="this.remove()">`:''}</span>
    <span class="tg">${ICON[w.t]||''}</span><span class="banner"><span>${esc(w.ti)}</span></span>${r?'<span class="rgem"></span>':''}
    <span class="desc">${esc([w.c,w.y].filter(Boolean).join(', ')||T[w.t]?.n||'')}</span></span>`;
}
const gem=r=>`<span class="rg r${r}"></span>`;
const rarityTag=r=>`<span class="bdg">${gem(r)}<span class="rname r${r}">${RAR[r].n}</span></span>`;
const metaLine=w=>[T[w.t]?.n,w.y,w.c].filter(Boolean).map(esc).join(', ');
const isDone=(id,who=uid)=>!!dataOf(who).done?.[id];
const isWant=id=>!!mine.want?.[id];
const rateOf=(id,who=uid)=>isDone(id,who)?(dataOf(who).rate?.[id]||1):0;
const recsAbout=id=>recs.filter(r=>r.work?.id===id&&r.from_id!==uid);
const finishers=id=>others().filter(k=>isDone(id,k));
const popularity=id=>new Set(recsAbout(id).map(r=>r.from_id)).size*2+finishers(id).length;
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return'à l’instant';if(s<3600)return`il y a ${Math.floor(s/60)} min`;if(s<86400)return`il y a ${Math.floor(s/3600)} h`;const d=Math.floor(s/86400);return d<30?`il y a ${d} j`:new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
function hl(text,q){
  text=String(text||'');if(!q)return esc(text);
  const flat=[...text].map(c=>{const n=(c.normalize('NFD')[0]||'').toLowerCase();return /[a-z0-9]/.test(n)?n:' '}).join('');
  const i=flat.indexOf(q);if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}
const dec=y=>!y?'':y<1960?'Avant 1960':Math.floor(y/10)*10+'s';
const decLabel=d=>d==='Avant 1960'?d:'Années '+d.slice(2);

/* ---------- Recherche ---------- */
const F={types:new Set(),genres:new Set(),decades:new Set(),status:'all',sort:'rel'};
let SR={q:null,items:[],pages:{},moreT:new Set(),loading:false,err:'',seq:0};
const typesSel=()=>F.types.size?[...F.types]:['f','s','l','j'];
const rr=lists=>{const out=[],max=Math.max(0,...lists.map(l=>l.length));for(let i=0;i<max;i++)for(const l of lists)if(l[i])out.push(l[i]);return out};
const localMode=()=>['done','want','rec'].includes(F.status);
function localItems(){
  const ids=F.status==='done'?Object.keys(mine.done):F.status==='want'?Object.keys(mine.want):[...new Set(recs.filter(r=>r.from_id!==uid).map(r=>r.work?.id))];
  return ids.map(id=>WK[id]).filter(Boolean);
}
async function runSearch(more=false){
  if(localMode()){renderSearch();return}
  const q=$('#q').value.trim();const seq=++SR.seq;
  if(!more)SR={q,items:[],pages:{},moreT:new Set(),loading:true,err:'',seq};else SR.loading=true;
  renderResults();
  const ts=more?[...SR.moreT]:typesSel(),lim=typesSel().length>1?10:20;
  const res=await Promise.all(ts.map(t=>{const p=(SR.pages[t]||0)+1;return api('search',{type:t,q,page:p,limit:lim}).then(r=>({t,p,r})).catch(err=>({t,err}))}));
  if(seq!==SR.seq)return;
  const lists=[];let errs=0;
  res.forEach(x=>{if(x.err){errs++;SR.moreT.delete(x.t);return}SR.pages[x.t]=x.p;x.r.more?SR.moreT.add(x.t):SR.moreT.delete(x.t);lists.push((x.r.items||[]).map(reg))});
  const seen=new Set(SR.items.map(w=>w.id));
  SR.items=SR.items.concat(rr(lists).filter(w=>!seen.has(w.id)));
  SR.err=errs&&errs===res.length?'Le catalogue ne répond pas. Vérifie les clés API dans config.php (README, section Catalogue).':'';
  SR.loading=false;renderSearch();
}
function filtered(list,{skipGenre=false}={}){
  return list.filter(w=>{
    if(F.types.size&&!F.types.has(w.t))return false;
    if(!skipGenre&&F.genres.size&&!(w.g||[]).some(g=>F.genres.has(g)))return false;
    if(F.decades.size&&!F.decades.has(dec(w.y)))return false;
    if(F.status==='todo'&&isDone(w.id))return false;
    return true;
  });
}
function sorted(list){
  const S=F.sort,l=[...list];
  if(S==='new')l.sort((a,b)=>(b.y||0)-(a.y||0));
  else if(S==='old')l.sort((a,b)=>(a.y||9999)-(b.y||9999));
  else if(S==='az')l.sort((a,b)=>String(a.ti).localeCompare(String(b.ti),'fr'));
  else if(S==='friends')l.sort((a,b)=>popularity(b.id)-popularity(a.id));
  return l;
}
function baseList(){const q=norm($('#q').value);return localMode()?localItems().filter(w=>!q||norm(w.ti+' '+(w.c||'')).includes(q)):SR.items}
function renderResults(){
  const q=norm($('#q').value),list=sorted(filtered(baseList())),ul=$('#results');
  const label=localMode()?'':(!q?'Tendances du moment, ':'');
  $('#count').textContent=SR.loading&&!list.length?'Recherche…':`${label}${list.length} œuvre${list.length>1?'s':''}`;
  if(SR.err&&!localMode()){ul.innerHTML=`<li><div class="empty"><b>Recherche indisponible.</b>${esc(SR.err)}</div></li>`;$('#resMore').innerHTML='';return}
  if(!list.length&&!SR.loading){ul.innerHTML=`<li><div class="empty"><div class="cardback"></div><b>Aucune œuvre ne correspond.</b>Retire un filtre ou essaie un autre titre.${activeCount()?'<br><button class="btn" data-act="reset">Effacer les filtres</button>':''}</div></li>`;$('#resMore').innerHTML='';return}
  ul.innerHTML=list.map(w=>{
    const n=new Set(recsAbout(w.id).map(r=>r.from_id)).size,b=[];
    if(isDone(w.id))b.push(rarityTag(rateOf(w.id)));
    if(isWant(w.id))b.push(`<span class="bdg">Plus tard</span>`);
    if(n)b.push(`<span class="bdg rec">Conseillé par ${n} ami${n>1?'s':''}</span>`);
    return `<li><button data-open="${esc(w.id)}">${cover(w)}<span><span class="ti">${hl(w.ti,q)}</span><br><span class="meta">${metaLine(w)}</span>${b.length?`<span class="badges">${b.join('')}</span>`:''}</span></button></li>`}).join('');
  $('#resMore').innerHTML=SR.loading?'<p class="loading">On fouille la bibliothèque…</p>':(!localMode()&&SR.moreT.size?'<button class="btn more" data-more>Voir plus d’œuvres</button>':'');
}

/* autocomplétion */
let acItems=[],acIdx=-1,acApi=[],acSeq=0,acT=null,acLoading=false,srT=null;
function onQuery(){
  acIdx=-1;const q=$('#q').value.trim();
  clearTimeout(acT);clearTimeout(srT);
  if(q.length<2){acApi=[];acLoading=false;renderAC()}
  else{acLoading=true;renderAC();acT=setTimeout(async()=>{
    const s=++acSeq,ts=typesSel();
    const res=await Promise.all(ts.map(t=>api('search',{type:t,q,limit:ts.length>1?3:6}).catch(()=>({items:[]}))));
    if(s!==acSeq)return;acApi=rr(res.map(r=>(r.items||[]).map(reg))).slice(0,8);acLoading=false;renderAC();
  },220)}
  srT=setTimeout(()=>runSearch(),450);
}
function renderAC(){
  const raw=$('#q').value,q=norm(raw),ac=$('#ac');
  $('#field').classList.toggle('has',!!raw);
  let html='';acItems=[];
  const opt=inner=>{const i=acItems.length-1;return `<div class="opt" role="option" id="ao${i}" data-i="${i}" aria-selected="${i===acIdx}">${inner}</div>`};
  if(!q){
    const rec=lsGet('sharefs-recent',[]);
    if(rec.length){html+='<div class="grp">Recherches récentes</div>';rec.forEach(t=>{acItems.push({k:'q',v:t});html+=opt(`<span class="ot">${esc(t)}</span>`)})}
  }else{
    const local=Object.values(WK).filter(w=>(isDone(w.id)||isWant(w.id)||recsAbout(w.id).length||finishers(w.id).length)&&norm(w.ti+' '+(w.c||'')).includes(q)).slice(0,3);
    if(local.length){html+='<div class="grp">Chez toi et tes amis</div>';local.forEach(w=>{acItems.push({k:'w',v:w.id});html+=opt(`<span class="tm t-${w.t}"></span><span><span class="ot">${hl(w.ti,q)}</span><br><span class="om">${metaLine(w)}</span></span>`)})}
    const ids=new Set(local.map(w=>w.id)),apiL=acApi.filter(w=>!ids.has(w.id));
    if(apiL.length){html+='<div class="grp">Œuvres</div>';apiL.forEach(w=>{acItems.push({k:'w',v:w.id});html+=opt(`${w.img?`<span class="cover t-${w.t} has-img" style="width:32px;min-height:46px;height:46px;padding:0"><img src="${esc(w.img)}" alt="" loading="lazy" referrerpolicy="no-referrer"></span>`:`<span class="tm t-${w.t}"></span>`}<span><span class="ot">${hl(w.ti,q)}</span><br><span class="om">${metaLine(w)}</span></span>`)})}
    if(!acItems.length)html=`<div class="grp">${acLoading?'Recherche…':'Aucune suggestion. Valide pour lancer la recherche.'}</div>`;
  }
  ac.innerHTML=html;const open=!!html&&document.activeElement===$('#q');
  ac.classList.toggle('open',open);$('#q').setAttribute('aria-expanded',open);
}
function pickAC(i){
  const it=acItems[i];if(!it)return;
  if(it.k==='w'){remember($('#q').value);closeAC();openSheet(it.v);return}
  $('#q').value=it.v;closeAC();runSearch();
}
function closeAC(){acIdx=-1;$('#ac').classList.remove('open');$('#q').setAttribute('aria-expanded','false');$('#q').removeAttribute('aria-activedescendant')}
function remember(v){v=v.trim();if(v.length<2)return;const r=lsGet('sharefs-recent',[]).filter(x=>x!==v);r.unshift(v);lsSet('sharefs-recent',r.slice(0,5))}

/* filtres */
const chip=(label,pressed,data,cls='chip')=>`<button class="${cls}" aria-pressed="${pressed}" ${data}>${label}</button>`;
const activeCount=()=>F.genres.size+F.decades.size+(F.status!=='all');
const STATUS=[['all','Tout'],['todo','À découvrir'],['done','Dans ma collection'],['want','Plus tard'],['rec','Conseillé par mes amis']];
function renderFilters(){
  $('#typeChips').innerHTML=chip('Tout',!F.types.size,'data-type=""')+Object.entries(T).map(([k,v])=>chip(`<span class="tm t-${k}"></span>${v.p}`,F.types.has(k),`data-type="${k}"`)).join('')+
    `<button class="chip ftr" id="openPanel" aria-expanded="${$('#panel').classList.contains('open')}" aria-controls="panel">Filtres${activeCount()?` <span class="cnt">${activeCount()}</span>`:''}</button>`;
  $('#fStatus').innerHTML=STATUS.map(([k,l])=>chip(l,F.status===k,`data-status="${k}"`)).join('');
  const base=filtered(baseList(),{skipGenre:true}),freq={};
  base.forEach(w=>(w.g||[]).forEach(g=>freq[g]=(freq[g]||0)+1));
  F.genres.forEach(g=>freq[g]=freq[g]||0);
  const gs=Object.keys(freq).sort((a,b)=>freq[b]-freq[a]||a.localeCompare(b,'fr')).slice(0,30);
  $('#fGenres').innerHTML=gs.length?gs.map(g=>chip(esc(g),F.genres.has(g),`data-genre="${esc(g)}"`)).join(''):'<span class="meta">Les genres apparaissent avec les résultats.</span>';
  const ds=[...new Set(baseList().map(w=>dec(w.y)).filter(Boolean).concat([...F.decades]))].sort();
  $('#fDecades').innerHTML=ds.map(d=>chip(decLabel(d),F.decades.has(d),`data-dec="${d}"`)).join('')||'<span class="meta">Aucune date disponible.</span>';
  const pills=[];
  F.genres.forEach(g=>pills.push([esc(g),`data-rm-genre="${esc(g)}"`]));
  F.decades.forEach(d=>pills.push([decLabel(d),`data-rm-dec="${d}"`]));
  if(F.status!=='all')pills.push([STATUS.find(s=>s[0]===F.status)[1],'data-rm-status']);
  $('#pills').innerHTML=pills.map(([l,d])=>`<button class="pill" ${d} aria-label="Retirer le filtre ${l}">${l}</button>`).join('');

function renderSearch(){renderFilters();renderResults()}

/* ---------- Fil ---------- */
let feedMode='all';
function recLine(r){
  const from=r.from_id,to=r.to_ids||[];
  if(from===uid)return `<b>Tu</b> as recommandé ${to.length?'à '+to.map(id=>`<b>${esc(nameOf(id))}</b>`).join(', '):'à tout le cercle'}`;
  if(to.includes(uid))return `<b>${esc(nameOf(from))}</b> te recommande${to.length>1?' (avec '+to.filter(i=>i!==uid).map(i=>esc(nameOf(i))).join(', ')+')':''}`;
  return `<b>${esc(nameOf(from))}</b> recommande au cercle`;
}
function renderFeed(){
  const forMe=recs.filter(r=>(r.to_ids||[]).includes(uid)).length;
  $('#feedMode').innerHTML=chip('Tout',feedMode==='all','data-feed="all"')+chip(`Pour moi${forMe?` <span class="cnt">${forMe}</span>`:''}`,feedMode==='me','data-feed="me"')+chip('Mes envois',feedMode==='sent','data-feed="sent"');
  let ev=recs.filter(r=>r.work&&r.work.id).map(r=>({k:'rec',r,w:WK[r.work.id]||reg(r.work),who:r.from_id,ts:Date.parse(r.created_at)}));
  if(feedMode==='all')for(const id of others()){const d=dataOf(id);for(const [wid,ts] of Object.entries(d.done))if(WK[wid])ev.push({k:'done',who:id,w:WK[wid],ts})}
  if(feedMode==='me')ev=ev.filter(e=>(e.r.to_ids||[]).includes(uid));
  if(feedMode==='sent')ev=ev.filter(e=>e.who===uid);
  ev.sort((a,b)=>b.ts-a.ts);
  const el=$('#feed');
  if(!ev.length){el.innerHTML=feedMode==='all'?`<div class="empty"><div class="cardback"></div><b>La taverne est calme.</b>Recommande une œuvre que tu as aimée, puis invite tes amis avec ton code (onglet Collection).<br><button class="btn pri" data-tab="search">Trouver une œuvre</button></div>`:`<div class="empty"><div class="cardback"></div><b>${feedMode==='me'?'Personne ne t’a encore recommandé d’œuvre en direct.':'Tu n’as encore rien recommandé.'}</b></div>`;return}
  el.innerHTML=ev.slice(0,80).map(e=>{
    const w=e.w,me=e.who===uid,r=rateOf(w.id,e.who);
    const line=e.k==='rec'?recLine(e.r):`<b>${esc(nameOf(e.who))}</b> ${T[w.t].did} et en fait une carte <span class="rname r${r}">${RAR[r].n}</span>`;
    const acts=me?'':`<div class="acts"><button class="btn ${isWant(w.id)?'on':''}" data-want="${esc(w.id)}">${isWant(w.id)?'Dans ma liste':'Plus tard'}</button><button class="btn ${isDone(w.id)?'on':'pri'}" data-quickdone="${esc(w.id)}">${isDone(w.id)?T[w.t].done+' ✓':T[w.t].act}</button></div>`;
    const badge=e.k==='rec'&&r?`<span class="badges">${rarityTag(r)}</span>`:'';
    return `<article class="ev"><div class="who">${avatar(e.who)}<span>${line}<br>${ago(e.ts)}</span>${me&&e.k==='rec'?`<button class="del" data-delrec="${esc(e.r.id)}" aria-label="Supprimer cette recommandation">Supprimer</button>`:''}</div>
      <button class="work" data-open="${esc(w.id)}">${cover(w)}<span><span class="ti">${esc(w.ti)}</span><br><span class="meta">${metaLine(w)}</span>${badge}</span></button>
      ${e.k==='rec'&&e.r.note?`<p class="note">« ${esc(e.r.note)} »</p>`:''}${acts}</article>`}).join('');

/* ---------- Collection ---------- */
let collWho=null,collView=lsGet('sharefs-collview','book'),collList='done',collType='',collRar=0,justAdded=null;
function spineH(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return [84,96,108,120][h%4]}
function renderColl(){
  const ids=[uid,...others()].filter(Boolean);
  if(!collWho||!ids.includes(collWho))collWho=uid;
  const isMe=collWho===uid;if(!isMe&&collList==='want')collList='done';
  $('#whoRow').innerHTML=ids.length>1?ids.map(id=>`<button class="chip" aria-pressed="${id===collWho}" data-who="${id}">${avatar(id)}${esc(id===uid?'Moi':nameOf(id))}</button>`).join(''):'';
  const d=dataOf(collWho);
  const done=Object.keys(d.done).filter(id=>WK[id]);
  const n=done.length,cur=[...RANKS].reverse().find(l=>n>=l[0]),next=RANKS.find(l=>n<l[0]),prev=cur[0];
  const rc=[0,0,0,0,0];done.forEach(id=>rc[rateOf(id,collWho)]++);
  $('#rank').innerHTML=`<div class="medal">${n}</div><div style="flex:1;min-width:0"><div class="rt">${esc(cur[1])}</div>
    <div class="meta">${n} carte${n>1?'s':''} dans ${isMe?'ta':'sa'} collection${next?`, rang «\u00a0${next[1]}\u00a0» à\u00a0${next[0]}`:''}</div>
    <div class="bar"><i style="width:${next?((n-prev)/(next[0]-prev))*100:100}%"></i></div>
    <div class="rarities">${[1,2,3,4].map(r=>`<span class="rar" title="${RAR[r].n}">${gem(r)}<b>${rc[r]}</b></span>`).join('')}</div></div>`;
  const per={f:0,s:0,l:0,j:0};done.forEach(id=>per[WK[id].t]!=null&&per[WK[id].t]++);
  $('#bookmarks').innerHTML=chip(`Tout <span class="n">${n}</span>`,!collType,'data-ctype=""','bm')+Object.entries(T).map(([k,v])=>chip(`<span class="tm t-${k}"></span>${v.p} <span class="n">${per[k]}</span>`,collType===k,`data-ctype="${k}"`,'bm')).join('');
  $('#collView').innerHTML=chip('Grimoire',collView==='book','data-cview="book"','')+chip('Étagère',collView==='shelf','data-cview="shelf"','');
  $('#collList').innerHTML=chip('Cartes obtenues',collList==='done','data-clist="done"')+(isMe?chip(`Plus tard (${Object.keys(mine.want).length})`,collList==='want','data-clist="want"'):'');
  $('#collTitle').textContent=collList==='want'?'À découvrir':collView==='shelf'?'L’étagère':'Le grimoire';
  $('#gfilter').innerHTML=collList==='want'?'':`<button aria-pressed="${!collRar}" data-crar="0"><span class="all">∗</span>Toutes</button>`+[1,2,3,4].map(r=>`<button aria-pressed="${collRar===r}" data-crar="${r}" class="r${r}">${gem(r)}${RAR[r].n}</button>`).join('');
  const q=norm($('#collQ').value);
  let items=Object.entries(collList==='want'?d.want:d.done).map(([id,ts])=>({w:WK[id],ts,r:collList==='want'?0:rateOf(id,collWho)})).filter(x=>x.w);
  items=items.filter(x=>(!collType||x.w.t===collType)&&(!collRar||x.r===collRar)&&(!q||norm(x.w.ti+' '+(x.w.c||'')+' '+(x.w.g||[]).join(' ')).includes(q)));
  const sh=$('#shelf'),raw=$('#collQ').value.trim();
  if(!items.length){
    sh.innerHTML=raw?`<div style="text-align:center;padding:10px 0"><p class="meta">Aucune carte de ce nom ici.</p><button class="btn pri" data-searchall>Chercher « ${esc(raw)} » dans toutes les œuvres</button></div>`:
      `<div style="text-align:center;padding:14px 0"><div class="cardback" style="width:90px;margin:0 auto 12px"></div><p class="meta" style="margin:0">${collList==='want'?'Ajoute des œuvres à voir plus tard depuis la recherche.':isMe?'Chaque œuvre terminée devient une carte de ta collection.':'Aucune carte pour l’instant.'}</p></div>`;
  }else if(collView==='book'){
    items.sort((a,b)=>b.r-a.r||b.ts-a.ts);
    sh.innerHTML=`<div class="cards">${items.map(({w,r})=>`<button data-open="${esc(w.id)}" style="border:0;background:none;padding:0" aria-label="${esc(w.ti)}">${card(w,r,(collList==='want'?'ghost ':'')+(w.id===justAdded?'new':''))}</button>`).join('')}</div>`;
  }else{

    sh.innerHTML=`<div class="shelf">${rows.map(row=>`<div class="plank">${row.map(({w,r})=>`<button class="spine t-${w.t}" style="height:${spineH(w.id)}px;--rc:var(--r${r||1})" data-open="${esc(w.id)}" title="${esc(w.ti)}">${esc(w.ti)}</button>`).join('')}</div>`).join('')}</div>`;
  }
  justAdded=null;renderAccount();
}

      <button class="btn pri" data-share="${esc(id)}">${recTo.size?`Envoyer à ${recTo.size} ami${recTo.size>1?'s':''}`:'Recommander au cercle'}</button>
    </div>
    ${about.length||fins.length?`<div class="social">
      ${about.map(x=>`<div class="line">${avatar(x.from_id)}<span><b>${esc(nameOf(x.from_id))}</b>${x.note?' : « '+esc(x.note)+' »':' le recommande'}</span></div>`).join('')}
      ${fins.map(k=>`<div class="line">${avatar(k)}<span>${esc(nameOf(k))} : ${gem(rateOf(id,k))} <span class="rname r${rateOf(id,k)}">${RAR[rateOf(id,k)].n}</span></span></div>`).join('')}</div>`:''}`;
  $('#scrim').classList.add('open');$('#sheet').classList.add('open');
  if(refocus)setTimeout(()=>$('#sheet').querySelector(pickOpen&&!done?'[data-rate]':'button[data-done]')?.focus(),50);
  if(!w.full&&detailsLoading!==id){detailsLoading=id;
    api('work',{id}).then(x=>{reg({...x,full:true});if(mine.works[id]){mine.works[id]=snap(WK[id]);save()}})
      .catch(()=>{WK[id].full=true})
      .finally(()=>{detailsLoading=null;if(sheetId===id&&$('#sheet').classList.contains('open'))refreshSheet()});
  }
}
function refreshSheet(){const typing=document.activeElement===$('#recNote');openSheet(sheetId,false);if(typing){const t=$('#recNote');t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
function closeSheet(){if(!sheetId)return;sheetId=null;$('#scrim').classList.remove('open');$('#sheet').classList.remove('open');lastFocus?.focus?.()}

/* ---------- Révélation ---------- */
function reveal(id){
  const w=WK[id],r=rateOf(id),el=$('#reveal');
  el.style.setProperty('--rc',`var(--r${r})`);
  el.innerHTML=`<div class="stage"><div class="flip">${card(w,r)}<div class="cardback"></div></div><div class="burst"></div>
    <div class="cap">Nouvelle carte<span class="rname">${RAR[r].n}</span></div><div class="tap">Touche pour continuer</div></div>`;
  el.classList.add('open');el.focus();
}
function closeReveal(){const el=$('#reveal');if(!el.classList.contains('open'))return;el.classList.remove('open');el.innerHTML=''}

/* ---------- Actions ---------- */
function keepWork(id){const w=WK[id];if(!w)return;if(isDone(id)||isWant(id))mine.works[id]=snap(w);else delete mine.works[id]}
function setRate(id,n){
  const was=isDone(id);
  mine.rate[id]=n;
  if(!was){mine.done[id]=Date.now();delete mine.want[id];justAdded=id}
  keepWork(id);save();
  if(!was){pickOpen=false;closeSheet();renderAll();reveal(id)}
  else{toast(`Carte ${RAR[n].n.toLowerCase()}`);renderAll()}
}
function toggleDone(id){
  if(!isDone(id)){pickOpen=true;refreshSheet();setTimeout(()=>$('#sheet [data-rate]')?.focus(),30);return}
  if(!confirm('Retirer cette carte de ta collection ?'))return;
  delete mine.done[id];delete mine.rate[id];keepWork(id);save();toast('Carte retirée');renderAll();
}
function toggleWant(id){if(mine.want[id])delete mine.want[id];else mine.want[id]=Date.now();keepWork(id);save();renderAll()}
async function share(id,btn){
  const w=WK[id];if(!w)return;btn.disabled=true;
  try{const rec=await call('POST','recs',{to_ids:[...recTo],work:snap(w),note:recNote.trim().slice(0,280)});
    recs.unshift(rec);toast(recTo.size?'Recommandation envoyée':'Recommandation publiée');recOpen=false;closeSheet();renderAll()}
  catch(e){toast(msg(e));btn.disabled=false}
}
async function delRec(id){
  if(!confirm('Supprimer cette recommandation ?'))return;
  try{await call('DELETE','recs/'+id);recs=recs.filter(r=>r.id!==id);renderAll()}catch(e){toast(msg(e))}
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}

function renderAll(){
  if(uid)members[uid]={name:myName,data:mine};
  renderFeed();renderSearch();renderColl();
  if(sheetId&&$('#sheet').classList.contains('open'))refreshSheet();
}
let searchStarted=false;
function setTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.dataset.tab===t?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  window.scrollTo(0,0);
  if(t==='search'){if(!searchStarted){searchStarted=true;runSearch()}setTimeout(()=>$('#q').focus(),30)}
}

/* ---------- Événements ---------- */
$('#reveal').addEventListener('click',closeReveal);
document.addEventListener('click',e=>{
  if(e.target.closest('#gate')||e.target.closest('#reveal'))return;
  const b=e.target.closest('button,[data-i]');if(!b)return;const d=b.dataset;
  if(d.i!==undefined&&b.classList.contains('opt')){pickAC(+d.i);return}
  if(d.tab!==undefined){closeSheet();setTab(d.tab);return}
  if(d.open){openSheet(d.open);return}
  if(d.quickdone){isDone(d.quickdone)?openSheet(d.quickdone):openSheet(d.quickdone,true,{pick:true});return}
  if(d.done){toggleDone(d.done);return}
  if(d.rate){setRate(sheetId,+d.rate);return}
  if(d.want){toggleWant(d.want);return}
  if(d.share){share(d.share,b);return}
  if(d.delrec){delRec(d.delrec);return}
  if(d.to!==undefined){if(!d.to)recTo.clear();else recTo.has(d.to)?recTo.delete(d.to):recTo.add(d.to);refreshSheet();return}
  if(d.feed){feedMode=d.feed;renderFeed();return}
  if(d.who){collWho=d.who;renderColl();return}
  if(d.clist){collList=d.clist;renderColl();return}
  if(d.cview){collView=d.cview;lsSet('sharefs-collview',collView);renderColl();return}
  if(d.ctype!==undefined){collType=d.ctype;renderColl();return}
  if(d.crar!==undefined){collRar=+d.crar;renderColl();return}
  if('searchall' in d){$('#q').value=$('#collQ').value;F.status='all';setTab('search');runSearch();return}
  if('explore' in d){$('#q').value='';F.status='all';F.types.clear();setTab('search');runSearch();return}
  if('more' in d){runSearch(true);return}
  if(b.id==='recBtn'){recOpen=!recOpen;refreshSheet();if(recOpen)$('#recNote')?.focus();return}
  if(d.type!==undefined){if(!d.type)F.types.clear();else F.types.has(d.type)?F.types.delete(d.type):F.types.add(d.type);runSearch();return}
  if(b.id==='openPanel'){$('#panel').classList.toggle('open');renderFilters();return}
  if(d.genre){F.genres.has(d.genre)?F.genres.delete(d.genre):F.genres.add(d.genre);renderSearch();return}
  if(d.dec){F.decades.has(d.dec)?F.decades.delete(d.dec):F.decades.add(d.dec);renderSearch();return}
  if(d.status){const was=localMode();F.status=d.status;was!==localMode()&&!localMode()?runSearch():renderSearch();return}
  if('rmGenre' in d){F.genres.delete(d.rmGenre);renderSearch();return}
  if('rmDec' in d){F.decades.delete(d.rmDec);renderSearch();return}
  if('rmStatus' in d){const was=localMode();F.status='all';was?runSearch():renderSearch();return}
  if(b.id==='reset'||d.act==='reset'){const was=localMode();F.genres.clear();F.decades.clear();F.status='all';was?runSearch():renderSearch();return}
  if(b.id==='closePanel'){$('#panel').classList.remove('open');renderFilters();$('#count').scrollIntoView({block:'start',behavior:'smooth'});return}
  if(b.id==='clear'){$('#q').value='';onQuery();$('#q').focus();return}
  if(b.id==='goSearch'){setTab('search');return}
});
document.addEventListener('input',e=>{if(e.target.id==='recNote')recNote=e.target.value;if(e.target.id==='collQ')renderColl()});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#reveal').classList.contains('open'))closeReveal();else if($('#sheet').classList.contains('open'))closeSheet();else closeAC()}else if((e.key==='Enter'||e.key===' ')&&$('#reveal').classList.contains('open')){e.preventDefault();closeReveal()}});
const qEl=$('#q');
qEl.addEventListener('input',onQuery);
qEl.addEventListener('focus',renderAC);
qEl.addEventListener('blur',()=>setTimeout(closeAC,150));
qEl.addEventListener('keydown',e=>{
  const open=$('#ac').classList.contains('open');
  if(e.key==='ArrowDown'&&acItems.length){e.preventDefault();if(!open)renderAC();acIdx=(acIdx+1)%acItems.length;markAC()}
  else if(e.key==='ArrowUp'&&acItems.length){e.preventDefault();acIdx=(acIdx-1+acItems.length)%acItems.length;markAC()}
  else if(e.key==='Enter'){e.preventDefault();if(open&&acIdx>=0)pickAC(acIdx);else{remember(qEl.value);closeAC();qEl.blur();clearTimeout(srT);runSearch()}}
});
function markAC(){document.querySelectorAll('#ac .opt').forEach(o=>o.setAttribute('aria-selected',+o.dataset.i===acIdx));const o=$('#ao'+acIdx);if(o){o.scrollIntoView({block:'nearest'});qEl.setAttribute('aria-activedescendant','ao'+acIdx)}}
$('#ac').addEventListener('mousedown',e=>e.preventDefault());
$('#sort').addEventListener('change',e=>{F.sort=e.target.value;renderResults()});

/* ---------- Accès ---------- */
const gate=$('#gate'),gIn=$('#gateIn');
function showGate(html){gIn.innerHTML=`<div class="brand">Sharefs</div><div class="deck" aria-hidden="true"><div class="cardback"></div><div class="cardback"></div><div class="cardback"></div></div>`+html;gate.classList.add('open');setTimeout(()=>gIn.querySelector('input')?.focus(),60)}
function hideGate(){gate.classList.remove('open')}
let pendingEmail='';
function stepEmail(err='',signup=false){
  showGate(`<h1 id="gateTitle">${signup?'Rejoins la taverne.':'Bienvenue à la taverne.'}</h1><p class="sub">${signup?'Un e-mail et un mot de passe d’au moins 8 caractères.':'Connecte-toi pour retrouver ta collection et les conseils de tes amis.'}</p>
  <label class="sr" for="gEmail">E-mail</label><input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" value="${esc(pendingEmail)}">
  <label class="sr" for="gPass">Mot de passe</label><input id="gPass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="Mot de passe">
  <p class="err" role="alert">${esc(err)}</p>
  <button class="btn pri" id="${signup?'gSignup':'gLogin'}">${signup?'Créer mon compte':'Entrer'}</button>
  <p class="or">${signup?'Déjà inscrit ?':'Pas encore de compte ?'}</p><button class="btn" id="${signup?'gToLogin':'gToSignup'}">${signup?'Me connecter':'Créer un compte'}</button>
  ${signup?'':'<button class="link" id="gForgot">Mot de passe oublié ?</button>'}`);
}
function stepForgot(err=''){
  showGate(`<h1 id="gateTitle">Mot de passe oublié.</h1><p class="sub">On t’envoie un code à 6 chiffres par e-mail.</p>
  <label class="sr" for="gEmail">E-mail</label><input id="gEmail" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.fr" value="${esc(pendingEmail)}">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gSendCode">Recevoir le code</button><button class="link" id="gToLogin">Retour</button>`);
}
function stepReset(err=''){
  showGate(`<h1 id="gateTitle">Nouveau mot de passe.</h1><p class="sub">Saisis le code reçu à ${esc(pendingEmail)} (pense aux spams).</p>
  <label class="sr" for="gCode">Code</label><input id="gCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Code à 6 chiffres">
  <label class="sr" for="gPass">Nouveau mot de passe</label><input id="gPass" type="password" autocomplete="new-password" placeholder="Nouveau mot de passe">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gReset">Changer le mot de passe</button><button class="link" id="gToLogin">Retour</button>`);
}
function stepName(err=''){
  showGate(`<h1 id="gateTitle">Comment tes amis t’appellent ?</h1><p class="sub">Ce prénom s’affiche à côté de tes recommandations.</p>
  <label class="sr" for="gName">Prénom</label><input id="gName" maxlength="40" autocomplete="given-name" placeholder="Prénom" value="${esc(myName)}">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gSaveName">Continuer</button>`);
}
function stepCircle(err=''){
  showGate(`<h1 id="gateTitle">Rejoins ta tablée.</h1><p class="sub">Un cercle regroupe les amis qui voient tes conseils et ta collection.</p>
  <label class="sr" for="gJoin">Code d’invitation</label><input id="gJoin" maxlength="6" autocapitalize="characters" placeholder="Code reçu d’un ami">
  <p class="err" role="alert">${esc(err)}</p><button class="btn pri" id="gJoinBtn">Rejoindre le cercle</button>
  <p class="or">ou</p><button class="btn" id="gCreate">Créer un cercle</button>${uid&&myCircles.length?'<button class="link" id="gCancel">Annuler</button>':''}`);
}
async function busy(btn,fn){btn.disabled=true;try{await fn()}finally{if(btn.isConnected)btn.disabled=false}}
function loggedIn(res){token=res.token;lsSet('sharefs-token',token);return afterLogin(res.user)}
gate.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const em=()=>{pendingEmail=($('#gEmail')?.value||pendingEmail).trim()};
  if(b.id==='gToSignup'){em();stepEmail('',true)}
  if(b.id==='gToLogin'){em();stepEmail()}
  if(b.id==='gForgot'){em();stepForgot()}
  if(b.id==='gCancel')hideGate();
  if(b.id==='gLogin'||b.id==='gSignup')busy(b,async()=>{
    const signup=b.id==='gSignup';em();const password=$('#gPass').value;
    try{await loggedIn(await call('POST',signup?'auth/signup':'auth/login',{email:pendingEmail,password}))}catch(err){stepEmail(msg(err),signup)}});
  if(b.id==='gSendCode')busy(b,async()=>{em();try{await call('POST','auth/forgot',{email:pendingEmail});stepReset()}catch(err){stepForgot(msg(err))}});
  if(b.id==='gReset')busy(b,async()=>{try{await loggedIn(await call('POST','auth/reset',{email:pendingEmail,code:$('#gCode').value.trim(),password:$('#gPass').value}))}catch(err){stepReset(msg(err))}});
  if(b.id==='gSaveName')busy(b,async()=>{const n=$('#gName').value.trim();if(!n)return stepName('Indique un prénom.');
    try{await call('PUT','me',{name:n});myName=n;await ensureCircle()}catch(err){stepName(msg(err))}});
  if(b.id==='gJoinBtn')busy(b,async()=>{try{await call('POST','circles/join',{code:$('#gJoin').value.trim()});await enterApp()}catch(err){stepCircle(msg(err))}});
  if(b.id==='gCreate')busy(b,async()=>{try{await call('POST','circles');await enterApp()}catch(err){stepCircle(msg(err))}});
});
gate.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();gate.querySelector('.btn.pri')?.click()}});

async function afterLogin(user){
  uid=user.id;myName=user.name||'';mine=normData(user.data);Object.values(mine.works).forEach(reg);
  if(!myName)return stepName();
  await ensureCircle();
}
async function ensureCircle(){
  const st=await call('GET','state');
  if(!st.circles.length)return stepCircle();
  applyState(st);await enterApp(true);
}
function applyState(st){
  members={};names={};
  st.members.forEach(m=>{const d=normData(m.data);members[m.id]={name:m.name,data:d};names[m.id]=m.name;Object.values(d.works).forEach(reg)});
  if(members[uid]&&!saving&&!dirty){mine=members[uid].data;myName=members[uid].name}
  myCircles=st.circles;recs=st.recs||[];recs.forEach(x=>reg(x.work));
  renderAll();
}
async function loadAll(){try{applyState(await call('GET','state'))}catch(e){if(e.code!=='unauthorized')toast(msg(e))}}
let poll=null;
async function enterApp(loaded=false){
  hideGate();if(!loaded)await loadAll();
  clearInterval(poll);poll=setInterval(()=>{if(document.visibilityState==='visible'&&uid)loadAll()},25000);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&uid)loadAll()});

/* ---------- Compte ---------- */
function renderAccount(){
  const el=$('#account');if(!el)return;
  if(!uid||collWho!==uid){el.innerHTML='';return}
  el.innerHTML=`<h2>Mon compte</h2><div class="account">
    <div class="line"><span>Prénom</span><b>${esc(myName)}</b></div>
    ${myCircles.map(c=>`<div class="line"><span>Code d’invitation<br><span class="code">${esc(c)}</span></span><button class="btn" data-invite="${esc(c)}">Inviter</button></div>`).join('')}
    <div class="stack">
      <button class="btn" data-acc="name">Changer de prénom</button>
      <button class="btn" data-acc="join">Rejoindre un autre cercle</button>
      <button class="btn" data-acc="logout">Me déconnecter</button>
      <button class="btn danger" data-acc="delete">Supprimer mon compte</button>
    </div></div><p class="credits">Données des œuvres : TMDB, Google Books et IGDB. Ce produit utilise l’API TMDB sans être approuvé ni certifié par TMDB.</p>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button[data-invite],button[data-acc]');if(!b)return;
  if(b.dataset.invite){const code=b.dataset.invite,link=CFG.apiBase||location.origin,text=`Rejoins-moi sur Sharefs avec le code ${code} : ${link}`;
    try{if(navigator.share)await navigator.share({title:'Sharefs',text});else{await navigator.clipboard.writeText(text);toast('Invitation copiée')}}catch(err){}return}
  const a=b.dataset.acc;
  if(a==='name')stepName();
  if(a==='join')stepCircle();
  if(a==='logout'){try{await call('POST','auth/logout')}catch(err){}token='';lsSet('sharefs-token','');location.reload()}
  if(a==='delete'&&confirm('Supprimer ton compte, ta collection et tes recommandations ? Cette action est définitive.')){
    try{await call('DELETE','me');token='';lsSet('sharefs-token','');location.reload()}catch(err){toast(msg(err))}}
});

/* ---------- Démarrage ---------- */
renderAll();
(async()=>{
  if(!token)return stepEmail();
  try{await afterLogin(await call('GET','me'))}catch(e){if(e.code!=='unauthorized')stepEmail(msg(e))}
})();

</script>
</body>
</html>
